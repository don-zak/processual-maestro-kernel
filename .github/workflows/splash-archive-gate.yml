name: Splash Archive Gate

on:
  push:
    branches:
      - agent/post-vq-local-web-acceptance
    paths:
      - .github/workflows/splash-archive-gate.yml

permissions:
  contents: read

jobs:
  archive-gate:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 3775d5e4d8ab114f5503de57bab53ecc26e1b32e
      ARCHIVE_NAME: maestro-splash-development-archive-2026-08-27
    steps:
      - name: Checkout preserved source state
        uses: actions/checkout@v4
        with:
          ref: 3775d5e4d8ab114f5503de57bab53ecc26e1b32e
          fetch-depth: 0

      - name: Freeze current main reference
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          printf '%s\n' "$MAIN_SHA" > /tmp/main_sha.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f processual_api/static/splash.html

      - name: Build exact Splash inventory and archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ARCHIVE_NAME"
          rm -rf "$ROOT" "$ARCHIVE_NAME.zip"
          mkdir -p "$ROOT"

          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          source_sha = os.environ["SOURCE_SHA"]
          root = pathlib.Path(os.environ["ARCHIVE_NAME"])
          main_sha = pathlib.Path("/tmp/main_sha.txt").read_text().strip()

          def git(*args, check=True):
              p = subprocess.run(["git", *args], text=True, capture_output=True)
              if check and p.returncode:
                  raise RuntimeError(f"git {' '.join(args)} failed: {p.stderr}")
              return p

          paths = git("ls-tree", "-r", "--name-only", source_sha).stdout.splitlines()
          candidates = sorted(p for p in paths if "splash" in p.lower())
          if "processual_api/static/splash.html" not in candidates:
              raise SystemExit("splash.html missing from candidate inventory")

          def exists_at(ref, path):
              return git("cat-file", "-e", f"{ref}:{path}", check=False).returncode == 0

          def blob_at(ref, path):
              p = git("rev-parse", f"{ref}:{path}", check=False)
              return p.stdout.strip() if p.returncode == 0 else None

          def cleanup_scope(path):
              name = pathlib.PurePosixPath(path).name.lower()
              return (
                  (path.startswith("processual_api/static/") and name.startswith("splash") and name.endswith(".svg"))
                  or (path.startswith("scripts/") and "splash" in name)
                  or (path.startswith("tests/") and "splash" in name)
                  or path == ".github/workflows/splash-visual-contract.yml"
              )

          rows = []
          for path in candidates:
              source_blob = blob_at(source_sha, path)
              main_exists = exists_at("origin/main", path)
              main_blob = blob_at("origin/main", path) if main_exists else None
              if path == "processual_api/static/splash.html":
                  classification = "ARCHIVE_RESTORE_MAIN" if source_blob != main_blob else "KEEP"
              elif cleanup_scope(path):
                  if not main_exists:
                      classification = "ARCHIVE_DELETE"
                  elif source_blob == main_blob:
                      classification = "KEEP"
                  else:
                      classification = "HOLD"
              else:
                  classification = "KEEP" if main_exists and source_blob == main_blob else "HOLD"

              src = pathlib.Path(path)
              if not src.is_file():
                  raise SystemExit(f"tracked candidate missing from checkout: {path}")
              dst = root / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              digest = hashlib.sha256(src.read_bytes()).hexdigest()
              rows.append({
                  "path": path,
                  "classification": classification,
                  "source_blob_sha": source_blob,
                  "main_blob_sha": main_blob,
                  "sha256": digest,
              })

          source_state = {
              "repository": "don-zak/processual-maestro-kernel",
              "source_branch": "agent/post-vq-local-web-acceptance",
              "source_head": source_sha,
              "archive_branch": "archive/maestro-splash-development-2026-08-27",
              "main_reference": main_sha,
              "pull_request": 165,
              "archived_at": "2026-08-27",
              "reason": "Splash development quarantined for later redesign",
              "restore_requires_manual_review": True,
              "inventory_file_count": len(rows),
          }
          (root / "SOURCE_STATE.json").write_text(json.dumps(source_state, indent=2) + "\n")
          (root / "INVENTORY.json").write_text(json.dumps(rows, indent=2) + "\n")

          counts = {}
          for row in rows:
              counts[row["classification"]] = counts.get(row["classification"], 0) + 1
          manifest = [
              "# MAESTRO Splash Development Archive",
              "",
              f"- Repository: `don-zak/processual-maestro-kernel`",
              f"- Source SHA: `{source_sha}`",
              f"- Main reference at archive time: `{main_sha}`",
              f"- Inventory files: **{len(rows)}**",
              "- Policy: archive first; cleanup only `ARCHIVE_DELETE`; restore only explicit `ARCHIVE_RESTORE_MAIN`; never auto-delete `HOLD`.",
              "",
              "## Classification counts",
              "",
          ]
          for key in ("ARCHIVE_DELETE", "ARCHIVE_RESTORE_MAIN", "HOLD", "KEEP"):
              manifest.append(f"- {key}: {counts.get(key, 0)}")
          manifest += [
              "",
              "## Canonical design contract preserved from transition report",
              "",
              "- Reference stage: 1672 x 941",
              "- route_tree_count: 125",
              "- canonical_pixels: 18,285",
              "- semantic_edges: 5,496",
              "- terminals: 740",
              "- junctions: 3,102",
              "- graph_raster_roundtrip_exact: true",
              "- synthetic_geometry_pixels: 0",
              "- structurally_exact: true",
              "- geometry_promoted: true",
              "- Colors: cyan #16d9ff; teal #18f5e9; lime #a6ff43; amber #ffad1f; violet #d36cff",
              "",
              "Do not reconstruct canonical route geometry by manual approximation, synthetic interpolation, invented connectors, hand-authored gap filling, or silent geometry repair.",
              "",
              "See `INVENTORY.json` for per-file provenance and checksums.",
          ]
          (root / "ARCHIVE_MANIFEST.md").write_text("\n".join(manifest) + "\n")

          restore = f"""# Restore Instructions\n\n1. Start from a clean branch and review current `main`.\n2. The immutable preserved source commit is `{source_sha}` and archive branch is `archive/maestro-splash-development-2026-08-27`.\n3. Restore files selectively from this archive; do not overwrite unrelated current files.\n4. Treat `HOLD` entries as manual-review only.\n5. Re-run Splash contracts and browser acceptance before promotion.\n"""
          (root / "RESTORE_INSTRUCTIONS.md").write_text(restore)

          archived_paths = [p for p in root.rglob("*") if p.is_file() and p.name != "SHA256SUMS.txt"]
          with (root / "SHA256SUMS.txt").open("w") as out:
              for p in sorted(archived_paths):
                  rel = p.relative_to(root)
                  out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {rel.as_posix()}\n")

          copied_source_files = sum(1 for row in rows if (root / row["path"]).is_file())
          if copied_source_files != len(rows):
              raise SystemExit(f"archive count mismatch: copied={copied_source_files} inventory={len(rows)}")
          print(json.dumps({"inventory": len(rows), "classifications": counts, "main": main_sha}, sort_keys=True))
          PY

          (cd "$ROOT" && sha256sum -c SHA256SUMS.txt)
          zip -qr "$ARCHIVE_NAME.zip" "$ROOT"
          unzip -t "$ARCHIVE_NAME.zip"
          test -s "$ARCHIVE_NAME.zip"

      - name: Upload verified archive
        uses: actions/upload-artifact@v4
        with:
          name: maestro-splash-development-archive-2026-08-27
          path: |
            maestro-splash-development-archive-2026-08-27.zip
            maestro-splash-development-archive-2026-08-27/ARCHIVE_MANIFEST.md
            maestro-splash-development-archive-2026-08-27/SOURCE_STATE.json
            maestro-splash-development-archive-2026-08-27/INVENTORY.json
            maestro-splash-development-archive-2026-08-27/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
