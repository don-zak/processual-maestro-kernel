name: Security Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install package and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,api,observability,security,database,cache,reports,llm]

      - name: Bandit medium/high security gate
        run: |
          bandit -r processual_api processual_kernel cgtlib \
            -x tests \
            -ll -ii

      - name: Audit installed external Python dependencies
        run: |
          pip freeze --exclude-editable \
            | grep -v '^processual-maestro-kernel==' \
            > /tmp/security-requirements.txt
          test -s /tmp/security-requirements.txt
          pip-audit --strict -r /tmp/security-requirements.txt

      - name: Verify public/private CGT boundary
        run: |
          test ! -d cgtlib/private
          python - <<'PY'
          try:
              import cgtlib.private
          except ModuleNotFoundError:
              print('OK: cgtlib.private is not importable')
          else:
              raise SystemExit('FAIL: cgtlib.private is importable from public tree')
          PY

      - name: Hardened CGT router typing
        run: |
          mypy processual_api/routers/cgt_governor.py \
            --ignore-missing-imports \
            --follow-imports=silent \
            --warn-unused-ignores \
            --show-error-codes

      - name: Security-sensitive regression suite
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_secret_encryption_readiness_regression.py \
            tests/test_adapter_configure_status_routes.py \
            tests/test_cgt_governor_route_boundaries.py \
            tests/test_governance_gateway_behavior_regression.py \
            tests/operations/test_release_check_strict_pytest.py \
            tests/test_security_headers_hardening.py \
            tests/test_auth_rate_limit_r5a.py \
            tests/test_auth_router_fail_closed_hardening.py \
            tests/test_database_pool_hardening_r1.py \
            tests/test_execution_fanout.py \
            tests/test_production_env_release_contract.py \
            tests/test_admin_marketplace_lemon_squeezy_webhooks_a3.py \
            tests/test_lemon_squeezy_inbox_event_identity_a3.py \
            tests/test_admin_marketplace_lemon_squeezy_inbox_ingestion_a3.py \
            tests/test_admin_marketplace_lemon_squeezy_security_regressions_a3.py \
            tests/test_admin_marketplace_lemon_squeezy_uow_a3.py

      - name: Focused hardening Ruff
        run: |
          ruff check \
            processual_api/db/session.py \
            processual_api/settings.py \
            processual_api/cgt_governor/adapters/execution_fanout.py \
            processual_api/middleware/security_headers.py \
            processual_api/auth/rate_limit.py \
            processual_api/auth/registration_router.py \
            processual_api/auth/session_router.py \
            processual_api/auth/mfa_router.py \
            processual_api/routers/cgt_governor.py \
            processual_api/admin_marketplace/lemon_squeezy_webhooks.py \
            processual_api/admin_marketplace/lemon_squeezy_inbox.py \
            processual_api/admin_marketplace/lemon_squeezy_inbox_lifecycle.py \
            tests/test_database_pool_hardening_r1.py \
            tests/test_execution_fanout.py \
            tests/test_production_env_release_contract.py \
            tests/test_security_headers_hardening.py \
            tests/test_auth_rate_limit_r5a.py \
            tests/test_auth_router_fail_closed_hardening.py \
            tests/test_admin_marketplace_lemon_squeezy_webhooks_a3.py \
            tests/test_lemon_squeezy_inbox_event_identity_a3.py \
            tests/test_admin_marketplace_lemon_squeezy_inbox_ingestion_a3.py \
            tests/test_admin_marketplace_lemon_squeezy_security_regressions_a3.py \
            tests/test_admin_marketplace_lemon_squeezy_uow_a3.py