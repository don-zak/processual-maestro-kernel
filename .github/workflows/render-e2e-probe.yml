name: Render E2E Probe

on:
  push:
    branches:
      - ops/render-e2e-93a1e20

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Render sandbox
        shell: bash
        run: |
          set -euo pipefail
          base="https://processual-maestro-kernel.onrender.com"

          echo "== GET /health/live =="
          health_code=$(curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --output /tmp/health.json --write-out '%{http_code}' \
            "$base/health/live")
          test "$health_code" = "200"
          cat /tmp/health.json
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              body = json.load(f)
          assert isinstance(body, dict), body
          assert body.get('status') in {'ok', 'live', 'healthy'}, body
          PY

          echo "== GET /users/1 =="
          user_code=$(curl --fail-with-body --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --output /tmp/user.json --write-out '%{http_code}' \
            "$base/users/1")
          test "$user_code" = "200"
          cat /tmp/user.json
          python - <<'PY'
          import json
          with open('/tmp/user.json', encoding='utf-8') as f:
              body = json.load(f)
          assert isinstance(body, dict), body
          assert body.get('id') == 1, body
          PY

          echo "== GET /evaluation/runtime/status =="
          runtime_code=$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 45 \
            --output /tmp/runtime.txt --write-out '%{http_code}' \
            "$base/evaluation/runtime/status")
          echo "HTTP $runtime_code"
          cat /tmp/runtime.txt
          # This Render service is the project-owned sandbox target, not the Maestro authority/runtime host.
          # It must not accidentally expose the Maestro evaluation runtime surface.
          test "$runtime_code" = "404"

          echo "RENDER_E2E_PASS sha=93a1e20c4a4f6f5db7553a2c1f30a5c0f9cf5d5b"
