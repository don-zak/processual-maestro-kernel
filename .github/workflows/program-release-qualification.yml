name: Program Release Qualification

on:
  push:
    branches:
      - "agent/**"
      - "release/**"
    paths:
      - "processual_api/auth/**"
      - "processual_api/billing/**"
      - "processual_api/admin_marketplace/**"
      - "processual_api/middleware/security_headers.py"
      - "processual_api/static/admin.html"
      - "processual_api/static/index.html"
      - "processual_api/static/splash.html"
      - "processual_api/static/register.html"
      - "processual_api/static/js/admin_*.js"
      - "processual_api/static/js/pages/offer.js"
      - "processual_api/static/js/pages/register.js"
      - ".env.production.example"
      - "config/infisical/**"
      - "docs/qualification/**"
      - "tests/test_auth_registration_*.py"
      - "tests/test_registration_plan_mode_matrix_a3.py"
      - "tests/test_admin_marketplace_*.py"
      - "tests/test_assessment_subscription_activation_a3.py"
      - "tests/test_settings_subscription_runtime_regression.py"
      - "tests/test_admin_backend_dashboard_regression.py"
      - "tests/test_release_commercial_entitlement_quota_contract_r1.py"
      - "tests/test_public_ui_release_contract_r1.py"
      - ".github/workflows/program-release-qualification.yml"
  pull_request:
    paths:
      - "processual_api/auth/**"
      - "processual_api/billing/**"
      - "processual_api/admin_marketplace/**"
      - "processual_api/middleware/security_headers.py"
      - "processual_api/static/admin.html"
      - "processual_api/static/index.html"
      - "processual_api/static/splash.html"
      - "processual_api/static/register.html"
      - "processual_api/static/js/admin_*.js"
      - "processual_api/static/js/pages/offer.js"
      - "processual_api/static/js/pages/register.js"
      - ".env.production.example"
      - "config/infisical/**"
      - "docs/qualification/**"
      - "tests/test_auth_registration_*.py"
      - "tests/test_registration_plan_mode_matrix_a3.py"
      - "tests/test_admin_marketplace_*.py"
      - "tests/test_assessment_subscription_activation_a3.py"
      - "tests/test_settings_subscription_runtime_regression.py"
      - "tests/test_admin_backend_dashboard_regression.py"
      - "tests/test_release_commercial_entitlement_quota_contract_r1.py"
      - "tests/test_public_ui_release_contract_r1.py"
      - ".github/workflows/program-release-qualification.yml"
  workflow_dispatch:

jobs:
  commercial-runtime-release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,security,database]

      - name: Registration and plan qualification
        run: |
          python -m pytest -q \
            tests/test_auth_registration_service_r4.py \
            tests/test_auth_registration_http_r5b_r1.py \
            tests/test_registration_plan_mode_matrix_a3.py \
            tests/test_release_commercial_entitlement_quota_contract_r1.py

      - name: Subscription entitlement and quota qualification
        run: |
          python -m pytest -q \
            tests/test_admin_marketplace_contracts_r1.py \
            tests/test_admin_marketplace_subscription_activation_service_a3.py \
            tests/test_assessment_subscription_activation_a3.py \
            tests/test_settings_subscription_runtime_regression.py

      - name: Supervisor workspace qualification
        run: |
          python -m pytest -q \
            tests/test_admin_backend_dashboard_regression.py \
            tests/test_release_commercial_entitlement_quota_contract_r1.py::test_admin_workspace_exposes_readiness_and_usage_without_becoming_authority

      - name: Public UI journey, authority, accessibility, and browser security qualification
        run: python -m pytest -q tests/test_public_ui_release_contract_r1.py

      - name: Production environment and Infisical contract qualification
        run: |
          python -m pytest -q \
            tests/test_release_commercial_entitlement_quota_contract_r1.py::test_infisical_manifest_is_value_free_and_fail_closed \
            tests/test_release_commercial_entitlement_quota_contract_r1.py::test_production_template_covers_release_gate_without_real_evidence \
            tests/test_release_commercial_entitlement_quota_contract_r1.py::test_cloud_run_container_honors_port_and_never_migrates_on_startup

      - name: Static quality gate
        run: |
          ruff check \
            processual_api/auth/registration_service.py \
            processual_api/billing/public_plan_journey.py \
            processual_api/billing/plan_fulfillment_catalog.py \
            processual_api/admin_marketplace/commercial_plan_projection.py \
            processual_api/admin_marketplace/subscription_activation_service.py \
            processual_api/admin_marketplace/subscription_runtime_bootstrap.py \
            processual_api/admin_marketplace/subscription_quota_usage.py \
            processual_api/middleware/security_headers.py \
            tests/test_release_commercial_entitlement_quota_contract_r1.py \
            tests/test_public_ui_release_contract_r1.py \
            --output-format=github
          flake8 . --count --select=E9,F63,F7,F82 --statistics

      - name: Secret scan
        run: python tools/secret_scan.py .

      - name: Dependency audit
        run: pip-audit
