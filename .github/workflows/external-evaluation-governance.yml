name: External Evaluation Governance qualification

on:
  push:
    branches:
      - agent/external-evaluation-governance-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  external-evaluation-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install public runtime and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,api,observability,security,database,cache,reports,llm]

      - name: Verify public/private boundary
        run: |
          test ! -d cgtlib/private
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("cgtlib.private") is None
          print("OK: private CGT package absent")
          PY

      - name: Ruff external-evaluation governance surfaces
        run: |
          ruff check             processual_api/cgt_governor/gateway/operation_policies.py             processual_api/integrations/api_key_access_policy.py             processual_api/services/evaluation_grants.py             processual_api/services/evaluation_authority_postgres.py             processual_api/services/external_evaluation_governance.py             processual_api/routers/settings_admin_evaluation_grants.py             processual_api/routers/evaluation_runtime.py             tests/test_external_evaluation_governance_v2.py             tests/test_external_evaluation_access_contract.py             tests/test_external_evaluation_binding_authority.py             tests/test_evaluation_runtime_delivery.py             tests/test_evaluation_runtime_replay_safety.py             tests/test_evaluation_api_key_runtime_quota.py

      - name: Type external-evaluation governance surfaces
        run: |
          mypy             processual_api/cgt_governor/gateway/operation_policies.py             processual_api/integrations/api_key_access_policy.py             processual_api/services/evaluation_grants.py             processual_api/services/evaluation_authority_postgres.py             processual_api/services/external_evaluation_governance.py             processual_api/routers/settings_admin_evaluation_grants.py             processual_api/routers/evaluation_runtime.py             --ignore-missing-imports             --follow-imports=silent             --show-error-codes

      - name: Focused External Evaluation Governance qualification
        run: |
          python -m pytest -q             tests/test_external_evaluation_governance_v2.py             tests/test_external_evaluation_access_contract.py             tests/test_external_evaluation_endpoint_auth.py             tests/test_external_evaluation_quota_separation.py             tests/test_external_evaluation_report_isolation.py             tests/test_external_evaluation_binding_authority.py             tests/test_evaluation_runtime_delivery.py             tests/test_evaluation_runtime_replay_safety.py             tests/test_evaluation_api_key_runtime_quota.py             tests/test_evaluation_shared_authority_contract.py             tests/test_admin_evaluation_grants.py             tests/test_admin_api_key_canonical_access_policy.py
