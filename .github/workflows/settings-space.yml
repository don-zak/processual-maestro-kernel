name: Settings Space

on:
  push:
    branches:
      - main
    paths:
      - processual_api/settings.py
      - processual_api/routers/__init__.py
      - processual_api/routers/settings.py
      - processual_api/routers/settings_provider_test_runtime.py
      - processual_api/routers/settings_subscription_runtime.py
      - processual_api/routers/client_provider_alias_18.py
      - processual_api/routers/client_api_keys_18.py
      - processual_api/schemas/settings.py
      - processual_api/static/index.html
      - processual_api/static/js/app.js
      - processual_api/static/js/pages/settings.js
      - processual_api/static/js/settings_layout_18.js
      - processual_api/static/js/settings_operations_18.js
      - processual_api/static/css/settings_layout_18.css
      - processual_api/static/css/settings_operations_18.css
      - processual_api/billing/commercial_settings_top_up_ui_contracts.py
      - processual_api/billing/commercial_settings_top_up_checkout_contracts.py
      - processual_api/billing/commercial_top_up_application_service.py
      - tests/test_settings_runtime_wiring_regression.py
      - tests/test_settings_provider_test_runtime_regression.py
      - tests/test_settings_subscription_runtime_regression.py
      - tests/test_settings_layout_18_ui.py
      - tests/test_settings_layout_18_r2_regression.py
      - tests/test_client_settings_ui_regression.py
      - tests/test_client_settings_lifecycle_regression.py
      - tests/test_client_settings_collapsible_ui_regression.py
      - tests/test_client_provider_connection_ui_regression.py
      - tests/test_client_provider_connection_setup_ui_regression.py
      - tests/test_client_provider_connection_endpoint_regression.py
      - tests/test_client_provider_secret_setup_ui_regression.py
      - tests/test_client_usage_summary_ui_regression.py
      - tests/test_client_usage_summary_security_regression.py
      - tests/test_client_readiness_ui_regression.py
      - tests/test_client_support_ui_regression.py
      - tests/test_client_workspace_lifecycle_regression.py
      - .github/workflows/settings-space.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev,api,security,database,cache,observability]'

      - name: Ruff Settings slice
        run: |
          ruff check \
            processual_api/settings.py \
            processual_api/routers/__init__.py \
            processual_api/routers/settings.py \
            processual_api/routers/settings_provider_test_runtime.py \
            processual_api/routers/settings_subscription_runtime.py \
            processual_api/routers/client_provider_alias_18.py \
            processual_api/routers/client_api_keys_18.py \
            processual_api/schemas/settings.py \
            processual_api/billing/commercial_settings_top_up_ui_contracts.py \
            processual_api/billing/commercial_settings_top_up_checkout_contracts.py \
            processual_api/billing/commercial_top_up_application_service.py \
            tests/test_settings_runtime_wiring_regression.py \
            tests/test_settings_provider_test_runtime_regression.py \
            tests/test_settings_subscription_runtime_regression.py

      - name: JavaScript syntax contracts
        run: |
          node --check processual_api/static/js/app.js
          node --check processual_api/static/js/pages/settings.js
          node --check processual_api/static/js/settings_layout_18.js
          node --check processual_api/static/js/settings_operations_18.js

      - name: Settings runtime and UI contracts
        run: |
          pytest -q \
            tests/test_settings_runtime_wiring_regression.py \
            tests/test_settings_provider_test_runtime_regression.py \
            tests/test_settings_subscription_runtime_regression.py \
            tests/test_settings_layout_18_ui.py \
            tests/test_settings_layout_18_r2_regression.py \
            tests/test_client_settings_ui_regression.py \
            tests/test_client_settings_lifecycle_regression.py \
            tests/test_client_settings_collapsible_ui_regression.py \
            tests/test_client_provider_connection_ui_regression.py \
            tests/test_client_provider_connection_setup_ui_regression.py \
            tests/test_client_provider_connection_endpoint_regression.py \
            tests/test_client_provider_secret_setup_ui_regression.py \
            tests/test_client_usage_summary_ui_regression.py \
            tests/test_client_usage_summary_security_regression.py \
            tests/test_client_readiness_ui_regression.py \
            tests/test_client_support_ui_regression.py \
            tests/test_client_workspace_lifecycle_regression.py
