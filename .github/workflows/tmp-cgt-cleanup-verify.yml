name: Temporary CGT Cleanup Verify

on:
  push:
    branches:
      - agent/cgt-stale-ignore-cleanup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]
      - name: Hardened router Mypy
        run: |
          mypy processual_api/routers/cgt_governor.py \
            --ignore-missing-imports \
            --follow-imports=silent \
            --warn-unused-ignores \
            --show-error-codes
      - name: Focused CGT regressions
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_cgt_governor_route_boundaries.py \
            tests/test_governance_gateway_behavior_regression.py \
            tests/test_adapter_configure_status_routes.py
      - name: Focused Ruff
        run: |
          ruff check \
            processual_api/routers/cgt_governor.py \
            tests/test_cgt_governor_route_boundaries.py \
            tests/test_governance_gateway_behavior_regression.py \
            tests/test_adapter_configure_status_routes.py
