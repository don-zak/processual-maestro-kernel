name: Security Hardening Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,api,observability,security,database,cache,reports,llm]

      - name: Bandit security scan
        run: |
          bandit -r processual_api processual_kernel cgtlib \
            -x tests \
            -ll -ii

      - name: Python dependency vulnerability audit
        run: |
          python -m pip freeze --exclude-editable > audit-requirements.txt
          grep -v '^processual-maestro-kernel==' audit-requirements.txt > audit-external-requirements.txt || true
          test -s audit-external-requirements.txt
          pip-audit --strict -r audit-external-requirements.txt

      - name: Verify public/private CGT runtime boundary
        run: |
          test ! -d cgtlib/private
          python - <<'PY'
          import importlib
          import cgtlib

          try:
              importlib.import_module("cgtlib.private")
          except ModuleNotFoundError:
              print("OK: cgtlib.private is unavailable in the public tree")
          else:
              raise SystemExit("FAIL: cgtlib.private is importable in the public tree")

          assert cgtlib is not None
          print("OK: public cgtlib facade remains importable")
          PY

      - name: Hardened CGT router typing check
        run: |
          mypy processual_api/routers/cgt_governor.py \
            --ignore-missing-imports \
            --follow-imports=silent \
            --warn-unused-ignores \
            --show-error-codes

      - name: Security-sensitive regression tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_secret_encryption_readiness_regression.py \
            tests/test_adapter_configure_status_routes.py \
            tests/test_cgt_governor_route_boundaries.py \
            tests/test_governance_gateway_behavior_regression.py \
            tests/operations/test_release_check_strict_pytest.py
