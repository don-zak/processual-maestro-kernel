name: Durable Execution

on:
  workflow_dispatch:
  push:
    branches:
      - feat/a3-admin-marketplace-original-offers
    paths:
      - processual_api/execution/**
      - benchmarks/durable_worker_scale.py
      - tests/test_durable_execution.py
      - tests/test_durable_worker.py
      - tests/test_durable_worker_pool.py
      - tests/test_durable_execution_service.py
      - tests/test_durable_execution_http.py
      - tests/test_redis_durable_execution.py
      - tests/test_optimized_redis_durable_execution.py
      - tests/test_execution_domain_capacity.py
      - tests/test_durable_worker_scale.py
      - tests/test_adaptive_concurrency.py
      - tests/test_durable_redis_qualification.py
      - .github/workflows/durable-execution.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install contract-test dependencies
        run: python -m pip install pytest pytest-asyncio redis ruff fastapi httpx

      - name: Lint durable execution slice
        run: >-
          python -m ruff check
          processual_api/execution
          benchmarks/durable_worker_scale.py
          tests/test_durable_execution.py
          tests/test_durable_worker.py
          tests/test_durable_worker_pool.py
          tests/test_durable_execution_service.py
          tests/test_durable_execution_http.py
          tests/test_redis_durable_execution.py
          tests/test_optimized_redis_durable_execution.py
          tests/test_execution_domain_capacity.py
          tests/test_durable_worker_scale.py
          tests/test_adaptive_concurrency.py
          tests/test_durable_redis_qualification.py

      - name: Verify durable execution contracts
        run: >-
          python -m pytest -q
          tests/test_durable_execution.py
          tests/test_durable_worker.py
          tests/test_durable_worker_pool.py
          tests/test_durable_execution_service.py
          tests/test_durable_execution_http.py
          tests/test_redis_durable_execution.py
          tests/test_optimized_redis_durable_execution.py
          tests/test_execution_domain_capacity.py
          tests/test_durable_worker_scale.py
          tests/test_adaptive_concurrency.py
          tests/test_durable_redis_qualification.py

      - name: Emit 1-2-4-8 worker qualification metrics
        env:
          PYTHONPATH: .
        run: >-
          python benchmarks/durable_worker_scale.py
          --redis-url "$TEST_REDIS_URL"
          --workers 1,2,4,8
          --jobs 96
          --handler-delay-ms 20
          --redis-telemetry
