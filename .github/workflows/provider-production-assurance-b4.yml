name: Provider Production Assurance B4

on:
  pull_request:
    branches:
      - feat/b3-usage-economics-operations
    paths:
      - "processual_api/integrations/provider_production_assurance.py"
      - "processual_api/integrations/provider_event_inbox.py"
      - "tests/test_provider_production_assurance_stage4.py"
      - "tests/test_provider_event_inbox_stage4.py"
      - "tests/test_provider_assurance_hardening_stage4.py"
      - "tests/test_client_provider_connection_endpoint_regression.py"
      - "tests/test_external_connectivity_r10_document_and_exports.py"
      - ".github/workflows/provider-production-assurance-b4.yml"

jobs:
  provider-production-assurance-stage4-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install public package
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Ruff Stage 4 provider assurance bundle
        run: |
          ruff check \
            processual_api/integrations/provider_production_assurance.py \
            processual_api/integrations/provider_event_inbox.py \
            tests/test_provider_production_assurance_stage4.py \
            tests/test_provider_event_inbox_stage4.py \
            tests/test_provider_assurance_hardening_stage4.py \
            --output-format=github

      - name: Stage 4 provider production assurance closure tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_provider_production_assurance_stage4.py \
            tests/test_provider_event_inbox_stage4.py \
            tests/test_provider_assurance_hardening_stage4.py \
            tests/test_client_provider_connection_endpoint_regression.py \
            tests/test_external_connectivity_r10_document_and_exports.py
