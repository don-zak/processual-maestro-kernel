name: Apply focused pre-external hardening

on:
  push:
    branches:
      - security/preexternal-readiness-hardening
    paths:
      - .github/workflows/apply-preexternal-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/preexternal-readiness-hardening
          fetch-depth: 0

      - name: Apply fail-closed adapter persistence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('processual_api/routers/cgt_governor.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _save_adapter_config(provider: str, api_key: str, model: str = "", base_url: str = "") -> None:\n    config: dict[str, str] = {"provider": provider, "model": model, "base_url": base_url}\n    if _adapter_crypto_available and _ADAPTER_CRYPTO_KEY and api_key:\n        try:\n            envelope = encrypt_aes256_gcm(api_key.encode("utf-8"), _ADAPTER_CRYPTO_KEY, key_id=provider)\n            config["encrypted_key"] = json.dumps(\n                {\n                    "algorithm": envelope.algorithm,\n                    "key_id": envelope.key_id,\n                    "nonce_b64": envelope.nonce_b64,\n                    "aad_b64": envelope.aad_b64,\n                    "ciphertext_b64": envelope.ciphertext_b64,\n                    "plaintext_sha3_256": envelope.plaintext_sha3_256,\n                    "ciphertext_sha3_256": envelope.ciphertext_sha3_256,\n                    "schema_version": envelope.schema_version,\n                    "created_at": envelope.created_at,\n                }\n            )\n        except Exception:\n            pass\n    path = _adapter_config_path()\n    path.write_text(json.dumps(config, indent=2, ensure_ascii=False), "utf-8")\n'''
          new = '''def _save_adapter_config(provider: str, api_key: str, model: str = "", base_url: str = "") -> None:\n    config: dict[str, str] = {"provider": provider, "model": model, "base_url": base_url}\n    if api_key:\n        if not _adapter_crypto_available:\n            raise RuntimeError("Adapter credential encryption is unavailable")\n        if not _ADAPTER_CRYPTO_KEY:\n            raise RuntimeError("PROCESSUAL_CRYPTO_KEY_B64 is required to persist adapter credentials")\n        try:\n            envelope = encrypt_aes256_gcm(api_key.encode("utf-8"), _ADAPTER_CRYPTO_KEY, key_id=provider)\n        except Exception as exc:\n            raise RuntimeError("Failed to encrypt adapter credential") from exc\n        config["encrypted_key"] = json.dumps(\n            {\n                "algorithm": envelope.algorithm,\n                "key_id": envelope.key_id,\n                "nonce_b64": envelope.nonce_b64,\n                "aad_b64": envelope.aad_b64,\n                "ciphertext_b64": envelope.ciphertext_b64,\n                "plaintext_sha3_256": envelope.plaintext_sha3_256,\n                "ciphertext_sha3_256": envelope.ciphertext_sha3_256,\n                "schema_version": envelope.schema_version,\n                "created_at": envelope.created_at,\n            }\n        )\n    path = _adapter_config_path()\n    path.write_text(json.dumps(config, indent=2, ensure_ascii=False), "utf-8")\n'''
          if old not in text:
              raise SystemExit('target adapter persistence block not found; refusing broad rewrite')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_adapter_config_persistence_fail_closed.py')
          test.write_text('''import json\n\nimport pytest\n\nfrom processual_api.routers import cgt_governor\n\n\ndef test_adapter_config_does_not_persist_when_encryption_fails(monkeypatch, tmp_path):\n    monkeypatch.setattr(cgt_governor, "_ADAPTER_DATA_DIR", tmp_path)\n    monkeypatch.setattr(cgt_governor, "_adapter_crypto_available", True)\n    monkeypatch.setattr(cgt_governor, "_ADAPTER_CRYPTO_KEY", "configured-key")\n\n    def fail_encrypt(*args, **kwargs):\n        raise ValueError("synthetic encryption failure")\n\n    monkeypatch.setattr(cgt_governor, "encrypt_aes256_gcm", fail_encrypt)\n\n    with pytest.raises(RuntimeError, match="Failed to encrypt adapter credential"):\n        cgt_governor._save_adapter_config("openai", "secret", "model")\n\n    assert not (tmp_path / "adapter_config.json").exists()\n\n\ndef test_adapter_config_requires_crypto_for_supplied_secret(monkeypatch, tmp_path):\n    monkeypatch.setattr(cgt_governor, "_ADAPTER_DATA_DIR", tmp_path)\n    monkeypatch.setattr(cgt_governor, "_adapter_crypto_available", False)\n    monkeypatch.setattr(cgt_governor, "_ADAPTER_CRYPTO_KEY", "")\n\n    with pytest.raises(RuntimeError, match="encryption is unavailable"):\n        cgt_governor._save_adapter_config("openai", "secret", "model")\n\n    assert not (tmp_path / "adapter_config.json").exists()\n\n\ndef test_adapter_config_without_secret_remains_supported(monkeypatch, tmp_path):\n    monkeypatch.setattr(cgt_governor, "_ADAPTER_DATA_DIR", tmp_path)\n    monkeypatch.setattr(cgt_governor, "_adapter_crypto_available", False)\n    monkeypatch.setattr(cgt_governor, "_ADAPTER_CRYPTO_KEY", "")\n\n    cgt_governor._save_adapter_config("generic_openai_compatible", "", "llama3", "http://localhost:11434/v1")\n\n    payload = json.loads((tmp_path / "adapter_config.json").read_text(encoding="utf-8"))\n    assert payload == {\n        "provider": "generic_openai_compatible",\n        "model": "llama3",\n        "base_url": "http://localhost:11434/v1",\n    }\n''', encoding='utf-8')
          PY

          git rm .github/workflows/apply-preexternal-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add processual_api/routers/cgt_governor.py tests/test_adapter_config_persistence_fail_closed.py
          git commit -m "Security: fail closed on adapter credential persistence"
          git push origin HEAD:security/preexternal-readiness-hardening
