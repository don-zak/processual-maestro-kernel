name: External Evaluation Owned Sandbox — Cloudflare

on:
  workflow_dispatch:
    inputs:
      expected_ref:
        description: Exact commit SHA expected to be deployed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: external-evaluation-owned-sandbox-cloudflare
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: external-evaluation-sandbox
    defaults:
      run:
        working-directory: deployment/evaluation-owned-sandbox/cloudflare
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_ref }}
          persist-credentials: false

      - name: Fail closed if checkout does not match requested ref
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.expected_ref }}" || {
            echo "::error::Checked out $actual but expected ${{ inputs.expected_ref }}"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install project test dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,security,database,cache]

      - name: Verify owned Evaluation scenario contracts
        working-directory: .
        run: |
          python -m pytest -q \
            tests/test_external_evaluation_owned_crm_scenarios.py \
            tests/test_external_evaluation_owned_integration_scenarios.py \
            tests/test_evaluation_owned_sandbox_contract.py

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d31bdc5a65b1d11d6c7852eab18
        with:
          node-version: "22"

      - name: Verify Cloudflare deployment authority is configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Deploy project-owned Evaluation sandbox with pinned Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 deploy
