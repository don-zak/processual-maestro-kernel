name: Splash Visual Contract

on:
  push:
    branches:
      - agent/post-vq-local-web-acceptance
    paths:
      - processual_api/static/splash.html
      - processual_api/static/splash_reference_board.svg
      - processual_api/static/splash_routes_*.svg
      - tests/test_static_console_smoke.py
      - tests/test_splash_side_card_attachment_alignment_a3.py
      - tests/test_splash_pulse_choreography_a3.py
      - tests/test_build_splash_runtime_manifest_a3.py
      - tests/test_render_splash_canonical_pcb_a3.py
      - tests/test_splash_stroke_promotion_readiness_a3.py
      - tests/browser_splash_acceptance.py
      - tests/browser_splash_keyboard_acceptance.py
      - scripts/build_splash_runtime_manifest.py
      - scripts/render_splash_canonical_pcb.py
      - scripts/check_splash_stroke_promotion_readiness.py
      - scripts/show_splash_browser.ps1
      - .github/workflows/splash-visual-contract.yml
  pull_request:
    branches: [main]
    paths:
      - processual_api/static/splash.html
      - processual_api/static/splash_reference_board.svg
      - processual_api/static/splash_routes_*.svg
      - tests/test_static_console_smoke.py
      - tests/test_splash_side_card_attachment_alignment_a3.py
      - tests/test_splash_pulse_choreography_a3.py
      - tests/test_build_splash_runtime_manifest_a3.py
      - tests/test_render_splash_canonical_pcb_a3.py
      - tests/test_splash_stroke_promotion_readiness_a3.py
      - tests/browser_splash_acceptance.py
      - tests/browser_splash_keyboard_acceptance.py
      - scripts/build_splash_runtime_manifest.py
      - scripts/render_splash_canonical_pcb.py
      - scripts/check_splash_stroke_promotion_readiness.py
      - scripts/show_splash_browser.ps1
      - .github/workflows/splash-visual-contract.yml

jobs:
  splash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run splash static and canonical attachment contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_static_console_smoke.py \
            tests/test_splash_side_card_attachment_alignment_a3.py \
            tests/test_splash_pulse_choreography_a3.py \
            tests/test_build_splash_runtime_manifest_a3.py \
            tests/test_render_splash_canonical_pcb_a3.py \
            tests/test_splash_stroke_promotion_readiness_a3.py
      - name: Run exact viewport Chromium acceptance
        run: PYTHONPATH=. python tests/browser_splash_acceptance.py
      - name: Run keyboard focus Chromium acceptance
        run: PYTHONPATH=tests:. python tests/browser_splash_keyboard_acceptance.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splash-browser-evidence
          path: artifacts/splash-browser/
          if-no-files-found: error
