name: Splash Visual Contract

on:
  push:
    branches:
      - agent/post-vq-local-web-acceptance
    paths:
      - processual_api/static/splash.html
      - processual_api/static/splash_routes_*.svg
      - tests/test_static_console_smoke.py
      - tests/test_splash_side_card_attachment_alignment_a3.py
      - .github/workflows/splash-visual-contract.yml
  pull_request:
    branches: [main]
    paths:
      - processual_api/static/splash.html
      - processual_api/static/splash_routes_*.svg
      - tests/test_static_console_smoke.py
      - tests/test_splash_side_card_attachment_alignment_a3.py
      - .github/workflows/splash-visual-contract.yml

jobs:
  splash-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run splash static and canonical attachment contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_static_console_smoke.py \
            tests/test_splash_side_card_attachment_alignment_a3.py
