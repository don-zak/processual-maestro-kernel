name: Normalize migration newline

on:
  push:
    branches:
      - security/preexternal-readiness-hardening
    paths:
      - .github/workflows/fix-0039-newline.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/preexternal-readiness-hardening
          fetch-depth: 0
      - name: Ensure trailing newline and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('alembic/versions/20260807_0039_top_up_quota_grants.py')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.rstrip('\n') + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/fix-0039-newline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add alembic/versions/20260807_0039_top_up_quota_grants.py
          git commit -m "Style: normalize migration newline"
          git push origin HEAD:security/preexternal-readiness-hardening
