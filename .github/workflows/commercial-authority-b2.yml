name: Commercial Authority B2

on:
  pull_request:
    branches:
      - feat/b1-automatic-api-readiness-gate
    paths:
      - "processual_api/billing/commercial_state_machine.py"
      - "processual_api/billing/commercial_event_contracts.py"
      - "processual_api/billing/commercial_top_up_transition_authority.py"
      - "processual_api/billing/commercial_top_up_order_grant_contracts.py"
      - "tests/test_commercial_state_machine_b2.py"
      - "tests/test_commercial_event_contracts_b2.py"
      - "tests/test_commercial_top_up_transition_authority_b2.py"
      - "tests/test_commercial_top_up*.py"
      - ".github/workflows/commercial-authority-b2.yml"

jobs:
  commercial-state-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install public package
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Ruff commercial authority changes
        run: |
          ruff check \
            processual_api/billing/commercial_state_machine.py \
            processual_api/billing/commercial_event_contracts.py \
            processual_api/billing/commercial_top_up_transition_authority.py \
            tests/test_commercial_state_machine_b2.py \
            tests/test_commercial_event_contracts_b2.py \
            tests/test_commercial_top_up_transition_authority_b2.py \
            --output-format=github

      - name: Focused commercial authority tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_commercial_state_machine_b2.py \
            tests/test_commercial_event_contracts_b2.py \
            tests/test_commercial_top_up_transition_authority_b2.py \
            tests/test_commercial_top_up_order_grant_contracts_group2.py \
            tests/test_commercial_top_up_order_grant_contracts_boundaries_group2.py \
            tests/test_commercial_top_up_application_service_group2.py
