name: Public Governance Genome qualification

on:
  push:
    branches:
      - agent/public-governance-genome-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-governance-genome:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,api,database]

      - name: Verify public/private boundary
        run: |
          test ! -d cgtlib/private
          python - <<'PY'
          try:
              import cgtlib.private
          except ModuleNotFoundError:
              print("OK: public tree exposes no private CGT package")
          else:
              raise SystemExit("FAIL: cgtlib.private is importable")
          PY

      - name: Ruff public governance surfaces
        run: |
          ruff check             processual_api/cgt_governor/gateway             processual_api/cgt_governor/policy/engine.py             processual_api/routers/cgt_governor.py             tests/test_public_governance_genome_v2.py             tests/test_cgt_wave3c_core_bundle.py             tests/test_governance_gateway_behavior_regression.py             tests/test_cgt_governor_route_boundaries.py

      - name: Focused public governance qualification
        run: |
          python -m pytest -q             tests/test_public_governance_genome_v2.py             tests/test_cgt_wave3c_core_bundle.py             tests/test_governance_gateway_behavior_regression.py             tests/test_cgt_governor_route_boundaries.py             tests/test_adapter_configure_status_routes.py

      - name: Public gateway typing
        run: |
          mypy             processual_api/cgt_governor/gateway             processual_api/cgt_governor/policy/engine.py             processual_api/routers/cgt_governor.py             --ignore-missing-imports             --follow-imports=silent             --show-error-codes
