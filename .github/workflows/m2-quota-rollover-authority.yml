name: M2 Quota Rollover Authority Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "processual_api/admin_marketplace/subscription_quota_rollover.py"
      - "processual_api/admin_marketplace/subscription_quota_rollover_persistence.py"
      - "processual_api/admin_marketplace/subscription_billing_period.py"
      - "processual_api/admin_marketplace/persistence/**"
      - "processual_api/billing/plan_fulfillment_catalog.py"
      - "tests/test_subscription_quota_rollover_a3.py"
      - ".github/workflows/m2-quota-rollover-authority.yml"

jobs:
  qualify-m2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Focused M2 mypy
        run: |
          python -m mypy \
            processual_api/admin_marketplace/subscription_quota_rollover.py \
            processual_api/admin_marketplace/subscription_quota_rollover_persistence.py \
            processual_api/admin_marketplace/subscription_billing_period.py \
            --follow-imports=silent \
            --warn-unused-ignores \
            --show-error-codes

      - name: Focused M2 pytest
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_subscription_quota_rollover_a3.py

      - name: Focused M2 Ruff
        run: |
          ruff check \
            processual_api/admin_marketplace/subscription_quota_rollover.py \
            processual_api/admin_marketplace/subscription_quota_rollover_persistence.py \
            processual_api/admin_marketplace/subscription_billing_period.py \
            tests/test_subscription_quota_rollover_a3.py
