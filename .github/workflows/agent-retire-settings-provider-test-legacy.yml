name: Agent retire settings provider-test legacy

on:
  push:
    branches:
      - agent/retire-settings-provider-test-legacy

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retire-settings-provider-test-legacy
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Apply exact legacy provider-test removal
        shell: python
        run: |
          from pathlib import Path

          path = Path('processual_api/routers/settings.py')
          text = path.read_text(encoding='utf-8')

          start_marker = '@router.post("/provider-connection/test", response_model=TestConnectionResult)\n'
          keep_marker = '@router.put("/llm-provider", response_model=dict)\n'
          legacy_start = '@router.post("/llm-provider/test", response_model=TestConnectionResult)\n'
          legacy_end = '@router.put("/notifications", response_model=NotificationSettings)\n'
          time_import = 'import time\n'
          result_import = '    TestConnectionResult,\n'

          for marker in (start_marker, keep_marker, legacy_start, legacy_end, time_import, result_import):
              if text.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one marker: {marker!r}; found {text.count(marker)}')

          first_start = text.index(start_marker)
          keep_start = text.index(keep_marker, first_start)
          text = text[:first_start] + text[keep_start:]

          legacy_start_idx = text.index(legacy_start)
          legacy_end_idx = text.index(legacy_end, legacy_start_idx)
          text = text[:legacy_start_idx] + text[legacy_end_idx:]

          text = text.replace(time_import, '', 1)
          text = text.replace(result_import, '', 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_settings_runtime_wiring_regression.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_name = 'def test_settings_retirement_candidates_still_exist_until_explicit_removal() -> None:\n'
          new_name = 'def test_remaining_settings_retirement_candidates_still_exist_until_explicit_removal() -> None:\n'
          retired_assertion = '    assert \'@router.post("/llm-provider/test"\' in router\n'
          for marker in (old_name, retired_assertion):
              if test_text.count(marker) != 1:
                  raise SystemExit(f'Expected exactly one test marker: {marker!r}; found {test_text.count(marker)}')
          test_text = test_text.replace(old_name, new_name, 1)
          test_text = test_text.replace(retired_assertion, '', 1)
          test_path.write_text(test_text, encoding='utf-8')

      - name: Verify exact retirement shape
        shell: python
        run: |
          from pathlib import Path
          text = Path('processual_api/routers/settings.py').read_text(encoding='utf-8')
          forbidden = (
              'async def test_client_provider_connection(',
              'async def test_llm_provider(',
              '@router.post("/provider-connection/test", response_model=TestConnectionResult)',
              '@router.post("/llm-provider/test", response_model=TestConnectionResult)',
              'import time\n',
              '    TestConnectionResult,\n',
          )
          present = [marker for marker in forbidden if marker in text]
          if present:
              raise SystemExit(f'Legacy provider-test markers remain: {present}')
          required = (
              '@router.put("/llm-provider", response_model=dict)',
              '@router.delete("/llm-provider", response_model=dict)',
              '@router.put("/notifications", response_model=NotificationSettings)',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f'Unexpected neighboring removal: {missing}')

          test_text = Path('tests/test_settings_runtime_wiring_regression.py').read_text(encoding='utf-8')
          if 'assert \'@router.post("/llm-provider/test"\' in router' in test_text:
              raise SystemExit('Retired text-only llm-provider/test guard remains')
          if 'def test_remaining_settings_retirement_candidates_still_exist_until_explicit_removal()' not in test_text:
              raise SystemExit('Remaining retirement-candidate guard was not preserved')

      - name: Install public package
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Ruff changed settings module and regression guard
        run: ruff check processual_api/routers/settings.py processual_api/routers/settings_provider_test_runtime.py tests/test_settings_provider_test_runtime_regression.py tests/test_client_provider_connection_endpoint_regression.py tests/test_settings_runtime_wiring_regression.py --output-format=github

      - name: Focused provider/settings regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_settings_provider_test_runtime_regression.py \
            tests/test_client_provider_connection_endpoint_regression.py \
            tests/test_settings_runtime_wiring_regression.py \
            tests/test_secret_encryption_readiness_regression.py

      - name: Remove temporary workflow and commit verified patch
        run: |
          rm .github/workflows/agent-retire-settings-provider-test-legacy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add processual_api/routers/settings.py tests/test_settings_runtime_wiring_regression.py .github/workflows/agent-retire-settings-provider-test-legacy.yml
          git diff --cached --check
          git commit -m 'retire legacy settings provider-test implementations'
          git push origin HEAD:agent/retire-settings-provider-test-legacy
