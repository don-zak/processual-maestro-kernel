name: Four-Stage PowerShell Verification

on:
  pull_request:
    branches:
      - feat/b3-usage-economics-operations
    paths:
      - "processual_api/**"
      - "tests/**"
      - "scripts/verify_four_stages.ps1"
      - ".github/workflows/four-stage-powershell-verification.yml"

jobs:
  four-stage-powershell-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install public package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Verify all four stages with PowerShell
        shell: pwsh
        run: |
          ./scripts/verify_four_stages.ps1

      - name: Upload four-stage verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-stage-powershell-verification
          path: artifacts/four-stage-verification
          if-no-files-found: error
          retention-days: 14
