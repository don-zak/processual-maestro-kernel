name: Coverage Audit Full

on:
  push:
    branches: ["audit/full-coverage-measurement-20260813"]

jobs:
  full-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Start Redis service
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - name: Install full repository package
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Run full repository coverage audit
        id: coverage
        shell: bash
        run: |
          set +e
          set -o pipefail
          PYTHONPATH=. python -m pytest \
            --cov=cgtlib --cov=processual_kernel --cov=processual_api \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage-full.json \
            --cov-report=term-missing -q \
            2>&1 | tee pytest-full-coverage.log
          test_status=${PIPESTATUS[0]}
          echo "test_status=${test_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('coverage-full.json')
          if not path.exists():
              print('coverage-full.json not produced')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          print(json.dumps(data.get('totals', {}), indent=2, sort_keys=True))
          PY

      - name: Upload full coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage-audit
          path: |
            coverage-full.json
            coverage.xml
            pytest-full-coverage.log
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve pytest result
        if: always()
        run: exit "${{ steps.coverage.outputs.test_status || '1' }}"
