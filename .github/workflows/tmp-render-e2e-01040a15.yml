name: Temporary Render E2E Qualification

on:
  push:
    branches:
      - audit/tmp-render-e2e-01040a15

permissions:
  contents: read

jobs:
  render-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Network boundary probe
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://processual-maestro-kernel.onrender.com/health/live | tee /tmp/health.json
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert payload.get('status') == 'live', payload
          PY
          curl --fail --silent --show-error https://processual-maestro-kernel.onrender.com/users/1 | tee /tmp/customer.json
          python - <<'PY'
          import json
          with open('/tmp/customer.json', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert payload == {'id': 1, 'name': 'Evaluation Sandbox Customer'}, payload
          PY
          code="$(curl --silent --show-error --output /tmp/authority.json --write-out '%{http_code}' https://processual-maestro-kernel.onrender.com/evaluation/runtime/status)"
          test "$code" = "404"
          echo "RENDER_NETWORK_PROBE_PASS health=200 customer=200 authority=404"
      - name: Install Maestro integration stack
        run: pip install -e '.[api,observability]'
      - name: Maestro verified transport E2E
        run: |
          python - <<'PY'
          import asyncio
          from processual_api.integrations.enterprise_endpoint_bindings import EnterpriseEndpointBindingSpec
          from processual_api.integrations.enterprise_sandbox_execution import SandboxCredentialEnvelope, execute_sandbox_binding
          from processual_api.integrations.sandbox_verified_transport import VerifiedPeerSandboxTransport

          class AnonymousResolver:
              async def resolve(self, *, credential_profile_id: str, binding_id: str):
                  assert credential_profile_id == 'anonymous_public_sandbox'
                  assert binding_id == 'evaluation.render.customer'
                  return SandboxCredentialEnvelope(headers={}, source='anonymous_public_sandbox')

          spec = EnterpriseEndpointBindingSpec(
              binding_id='evaluation.render.customer',
              display_name='Evaluation Render customer',
              adapter_contract_id='evaluation-render',
              task_id='evaluation.customer_context',
              credential_profile_id='anonymous_public_sandbox',
              environment='sandbox',
              base_url='https://processual-maestro-kernel.onrender.com',
              method='GET',
              path='/users/{customer_id}',
              required_scope_ids=['evaluation:read'],
              path_parameters={'customer_id': '$task.customer_id'},
              request_headers={'Accept': 'application/json'},
              response_data_path='$',
              field_mapping={
                  'customer_id': '$.id',
                  'customer_name': '$.name',
              },
              success_codes=[200],
          )

          async def main():
              transport = VerifiedPeerSandboxTransport()
              result = await execute_sandbox_binding(
                  spec,
                  task_input={'customer_id': 1},
                  approved_operation_classes={'read'},
                  approval_reference='render_e2e_01040a15',
                  credential_resolver=AnonymousResolver(),
                  transport=transport,
              )
              assert result['status'] == 'sandbox_proof_passed', result
              assert result['network_request_executed'] is True, result
              assert result['mapping_valid'] is True, result
              assert result['canonical_input'] == {
                  'customer_id': 1,
                  'customer_name': 'Evaluation Sandbox Customer',
              }, result
              assert result['http_status'] == 200, result
              assert result['credential_source'] == 'anonymous_public_sandbox', result
              assert result['credential_material_included'] is False, result
              assert result['raw_response_included'] is False, result
              assert result['production_allowed'] is False, result
              assert len(result['evidence_sha256']) == 64, result
              assert len(result['task_injection_sha256']) == 64, result
              assert transport.last_verified_peer, result
              print(
                  'MAESTRO_RENDER_E2E_PASS',
                  f"execution_id={result['execution_id']}",
                  f"peer={transport.last_verified_peer}",
                  f"http_status={result['http_status']}",
                  f"evidence_sha256={result['evidence_sha256']}",
                  f"task_injection_sha256={result['task_injection_sha256']}",
              )

          asyncio.run(main())
          PY
