name: Apply Encrypt Failure Hardening

on:
  push:
    branches:
      - audit/deep-integrity-99-confidence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/deep-integrity-99-confidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply guarded patch
        run: python tools/apply_encrypt_failure_hardening.py
      - name: Add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_secret_encryption_readiness_regression.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\ndef test_adapter_config_api_key_is_encrypted_when_crypto_key_available'
          test = '''\n\ndef test_llm_provider_fails_closed_when_encryption_raises(monkeypatch, tmp_path):\n    raw_secret = "sk-prod-provider-secret-encryption-failure"\n\n    monkeypatch.setattr(settings_router, "_DATA_DIR", tmp_path)\n    monkeypatch.setattr(settings_router, "_CRYPTO_KEY", crypto.generate_key_b64())\n    monkeypatch.setattr(settings_router, "_crypto_available", True)\n\n    def fail_encrypt(*args, **kwargs):\n        raise ValueError("simulated encryption failure")\n\n    monkeypatch.setattr(settings_router, "encrypt_aes256_gcm", fail_encrypt)\n\n    body = SimpleNamespace(\n        provider="openai",\n        api_key=raw_secret,\n        model="gpt-4o-mini",\n    )\n\n    with pytest.raises(HTTPException) as exc_info:\n        _run(\n            settings_router.save_llm_provider(\n                body,\n                current_user={"sub": "encrypt_failure_user"},\n            )\n        )\n\n    assert exc_info.value.status_code == 503\n    assert exc_info.value.detail == "Provider secret encryption failed"\n    assert not (tmp_path / "settings_encrypt_failure_user.json").exists()\n'''
          if text.count(marker) != 1:
              raise SystemExit('regression insertion marker not unique')
          path.write_text(text.replace(marker, test + marker, 1), encoding='utf-8')
          PY
      - name: Verify targeted regression and AST audit
        run: |
          python -m pip install '.[all,dev]'
          pytest -q tests/test_secret_encryption_readiness_regression.py
          python tools/deep_integrity_audit.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processual_api/routers/settings.py tests/test_secret_encryption_readiness_regression.py
          git commit -m "Harden provider encryption failure handling"
          git push origin HEAD:audit/deep-integrity-99-confidence
