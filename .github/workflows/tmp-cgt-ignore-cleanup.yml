name: Temporary CGT Ignore Cleanup

on:
  push:
    branches:
      - agent/cgt-stale-ignore-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cgt-stale-ignore-cleanup
      - name: Remove only the proven stale suppression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('processual_api/routers/cgt_governor.py')
          source = path.read_text(encoding='utf-8')
          old = '    results.sort(key=lambda r: r["reward"], reverse=True)  # type: ignore[arg-type, return-value]\n'
          new = '    results.sort(key=lambda r: r["reward"], reverse=True)\n'
          count = source.count(old)
          if count == 0:
              print('stale suppression already absent')
          elif count == 1:
              path.write_text(source.replace(old, new), encoding='utf-8')
          else:
              raise SystemExit(f'expected at most one stale suppression, found {count}')
          PY
          git diff --check
      - name: Commit cleanup when needed
        run: |
          if git diff --quiet -- processual_api/routers/cgt_governor.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add processual_api/routers/cgt_governor.py
          git commit -m 'chore: remove stale CGT type suppression'
          git push origin HEAD:agent/cgt-stale-ignore-cleanup
