name: CI (Public)

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Start Redis service
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping

      - name: Strip private modules (public build)
        run: |
          rm -rf cgtlib/private/
          rm -f cgtlib/pyproject.toml

      - name: Install public package
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Verify private modules not accessible
        run: |
          python -c "
          try:
              import cgtlib.private
              print('FAIL: private modules should not be importable')
              exit(1)
          except ModuleNotFoundError:
              print('OK: private modules correctly excluded')
          "

      - name: Verify Redis service
        run: |
          python -c "import redis; r=redis.Redis(host='127.0.0.1', port=6379); assert r.ping()"

      - name: Ruff check
        run: ruff check . --output-format=github

      - name: Lint (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --statistics

      - name: Type check (mypy)
        run: |
          mypy \
            processual_api/auth/security.py \
            processual_api/middleware/subscription.py \
            processual_api/services/operator_pilot_handoff_intake_preview.py \
            processual_api/cgt_governor/data/storage.py \
            --ignore-missing-imports \
            --follow-imports=silent

      - name: Capacity regression tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_runtime_capacity.py \
            tests/test_execution_fanout.py \
            tests/test_adapter_registry.py \
            tests/test_workload_probe.py \
            tests/test_performance_guard.py \
            tests/test_topology_compare.py \
            tests/test_fanout_probe.py \
            tests/test_subscription_middleware_database_runtime_a3.py

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -m pytest \
            --cov=processual_kernel --cov=processual_api \
            --cov-report=xml --cov-report=term-missing -q \
            2>&1 | tee pytest-public.log

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-public-${{ matrix.python-version }}
          path: pytest-public.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*
