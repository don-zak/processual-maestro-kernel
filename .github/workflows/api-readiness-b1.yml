name: API Readiness B1

on:
  pull_request:
    branches:
      - feat/a3-admin-marketplace-original-offers
    paths:
      - "processual_api/api_readiness.py"
      - "processual_api/api_readiness_gate.py"
      - "processual_api/main.py"
      - "processual_api/routers/**"
      - "processual_api/admin_marketplace/**"
      - "processual_api/billing/**"
      - "processual_api/auth/**"
      - "tests/test_api_readiness_*.py"
      - ".github/workflows/api-readiness-b1.yml"

jobs:
  readiness-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install public package
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Ruff readiness changes
        run: |
          ruff check processual_api/api_readiness.py processual_api/api_readiness_gate.py tests/test_api_readiness_automatic_gate_b1.py tests/test_api_readiness_app_coverage_b1.py --output-format=github

      - name: Focused API readiness tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_api_production_readiness_gate_a3.py \
            tests/test_api_readiness_automatic_gate_b1.py \
            tests/test_api_readiness_app_coverage_b1.py
