name: Apply Deep Integrity Fixes

on:
  push:
    branches:
      - audit/deep-integrity-99-confidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/deep-integrity-99-confidence
          fetch-depth: 0

      - name: Apply guarded patch
        run: python tools/apply_deep_integrity_patch.py

      - name: Verify patch
        run: |
          python -m compileall -q processual_api/routers/settings.py
          grep -F 'Provider secret encryption is unavailable' processual_api/routers/settings.py
          grep -F 'Agentic operations and governance control plane' pyproject.toml

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add processual_api/routers/settings.py pyproject.toml
          git commit -m 'Harden legacy provider secret persistence'
          git push origin HEAD:audit/deep-integrity-99-confidence
