name: Apply Deep Integrity Fixes

on:
  push:
    branches:
      - audit/deep-integrity-99-confidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/deep-integrity-99-confidence
          fetch-depth: 0

      - name: Apply exact guarded patches
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('processual_api/routers/settings.py')
          text = settings.read_text(encoding='utf-8-sig')
          old = '''    encrypted = _encrypt_api_key(body.api_key, user_id) if body.api_key else None
          raw["llm_provider"] = {
              "configured": bool(body.api_key and body.provider),
              "provider": body.provider,
              "model": body.model,
              "last_tested": raw.get("llm_provider", {}).get("last_tested"),
          }
          '''
          new = '''    encrypted = _encrypt_api_key(body.api_key, user_id) if body.api_key else None
          if body.api_key and not encrypted:
              raise HTTPException(
                  status_code=503,
                  detail="Provider secret encryption is unavailable",
              )

          raw["llm_provider"] = {
              "configured": bool(encrypted and body.provider),
              "provider": body.provider,
              "model": body.model,
              "last_tested": raw.get("llm_provider", {}).get("last_tested"),
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one legacy LLM-provider block, found {text.count(old)}')
          text = text.replace(old, new)
          old_return = '''        "configured": bool(body.api_key and body.provider),
          '''
          if text.count(old_return) < 1:
              raise SystemExit('Expected legacy configured return marker')
          # Replace only the occurrence after save_llm_provider by splitting at the route.
          marker = '@router.put("/llm-provider", response_model=dict)'
          before, after = text.split(marker, 1)
          if after.count(old_return) < 1:
              raise SystemExit('Expected configured return inside save_llm_provider')
          after = after.replace(old_return, '        "configured": bool(encrypted and body.provider),\n', 1)
          settings.write_text(before + marker + after, encoding='utf-8')

          pyproject = Path('pyproject.toml')
          project_text = pyproject.read_text(encoding='utf-8')
          old_description = 'description = "Production-ready Processual Maestro Kernel with CGT v2, security layer, backend API, observability, and Discord monitoring."'
          new_description = 'description = "Agentic operations and governance control plane with CGT, security, API, observability, and controlled integration surfaces."'
          if project_text.count(old_description) != 1:
              raise SystemExit('Expected exactly one production-ready package description')
          pyproject.write_text(project_text.replace(old_description, new_description), encoding='utf-8')
          PY

      - name: Verify guarded patch semantics
        run: |
          python -m compileall -q processual_api/routers/settings.py
          grep -F 'Provider secret encryption is unavailable' processual_api/routers/settings.py
          grep -F 'Agentic operations and governance control plane' pyproject.toml

      - name: Commit guarded fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add processual_api/routers/settings.py pyproject.toml
          git commit -m 'Harden legacy provider secret persistence'
          git push origin HEAD:audit/deep-integrity-99-confidence
