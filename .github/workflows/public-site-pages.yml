name: Public Product Site Pages

on:
  workflow_dispatch:
  push:
    branches:
      - site/processual-maestro-public-page
    paths:
      - "docs/site/**"
      - ".github/workflows/public-site-pages.yml"
      - "tests/test_public_site_contract.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: processual-maestro-public-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify public-site contract
        run: python -m pytest -q tests/test_public_site_contract.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
