name: M3 Payment Authority Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "processual_api/admin_marketplace/payment_evidence_service.py"
      - "processual_api/admin_marketplace/payment_reconciliation_service.py"
      - "processual_api/admin_marketplace/persistence/**"
      - "processual_api/admin_marketplace/notification_outbox.py"
      - "tests/test_admin_marketplace_payment_evidence_service_a3.py"
      - "tests/test_admin_marketplace_payment_reconciliation_service_a3.py"
      - ".github/workflows/m3-payment-authority.yml"

jobs:
  qualify-m3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,api,observability,security,database,cache,reports,llm]

      - name: Focused M3 mypy
        run: |
          python -m mypy \
            processual_api/admin_marketplace/payment_evidence_service.py \
            processual_api/admin_marketplace/payment_reconciliation_service.py \
            --follow-imports=silent \
            --warn-unused-ignores \
            --show-error-codes

      - name: Focused M3 pytest
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_admin_marketplace_payment_evidence_service_a3.py \
            tests/test_admin_marketplace_payment_reconciliation_service_a3.py

      - name: Focused M3 Ruff
        run: |
          ruff check \
            processual_api/admin_marketplace/payment_evidence_service.py \
            processual_api/admin_marketplace/payment_reconciliation_service.py \
            tests/test_admin_marketplace_payment_evidence_service_a3.py \
            tests/test_admin_marketplace_payment_reconciliation_service_a3.py
