name: Public Docker Build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "cgtlib/**"
      - "processual_kernel/**"
      - "processual_api/**"
      - ".github/workflows/docker.yml"
      - "tests/test_public_docker_trust_boundary_r1.py"
  workflow_dispatch:

jobs:
  public-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ephemeral public Docker image
        id: build_ephemeral
        if: github.event_name != 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: public
          push: false
          load: true
          tags: pmk-public-qualification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push tagged public Docker image
        id: build_published
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: public
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/processual-maestro-public:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/processual-maestro-public:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke public image trust boundary
        if: github.event_name != 'push'
        shell: bash
        run: |
          docker run --rm pmk-public-qualification:${{ github.sha }} python - <<'PY'
          import importlib.util

          import cgtlib
          from processual_api.cgt_governor.governor import govern_answer
          from processual_api.integrations.private_evaluation_boundary import (
              PrivateEvaluationUnavailableError,
          )
          from processual_api.main import app

          assert cgtlib._HAS_PRIVATE is False
          assert importlib.util.find_spec("cgtlib.private") is None
          assert importlib.util.find_spec("processual_api.private_integrations") is None
          assert "/cgt/govern/evaluate" in {
              getattr(route, "path", "") for route in app.routes
          }
          assert getattr(app.state, "private_evaluation_provider", None) is None
          try:
              govern_answer(answer="public-container-probe")
          except PrivateEvaluationUnavailableError as exc:
              assert str(exc) == "private_evaluation_unavailable"
          else:
              raise AssertionError("public container must fail closed without private provider")
          PY

      - name: Record ephemeral public image identity
        if: github.event_name != 'push'
        shell: bash
        run: |
          mkdir -p release-evidence
          docker image inspect pmk-public-qualification:${{ github.sha }} --format '{{.Id}}' \
            | tee release-evidence/public-ephemeral-image-id.txt

      - name: Record immutable published image digest
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p release-evidence
          printf '%s\n' '${{ steps.build_published.outputs.digest }}' \
            | tee release-evidence/public-image-digest.txt
          grep -Eq '^sha256:[0-9a-f]{64}$' release-evidence/public-image-digest.txt

      - name: Install Syft 1.50.0
        shell: bash
        run: |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin v1.50.0
          syft version

      - name: Generate public container SBOM
        shell: bash
        run: |
          mkdir -p release-evidence
          if [ "${{ github.event_name }}" = "push" ]; then
            target="ghcr.io/${{ github.repository_owner }}/processual-maestro-public@${{ steps.build_published.outputs.digest }}"
          else
            target="pmk-public-qualification:${{ github.sha }}"
          fi
          syft "$target" \
            -o cyclonedx-json=release-evidence/public-container.cdx.json \
            -o spdx-json=release-evidence/public-container.spdx.json
          test -s release-evidence/public-container.cdx.json
          test -s release-evidence/public-container.spdx.json

      - name: Verify public container SBOM trust boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          forbidden = (
              "cgtlib/private",
              "cgtlib.private",
              "processual_api/private_integrations",
              "processual_api.private_integrations",
          )
          for path in (
              Path("release-evidence/public-container.cdx.json"),
              Path("release-evidence/public-container.spdx.json"),
          ):
              payload = json.loads(path.read_text())
              rendered = json.dumps(payload, sort_keys=True)
              assert not any(value in rendered for value in forbidden), path
          PY

      - name: Upload public container evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-container-evidence-${{ github.sha }}
          path: release-evidence/*
          if-no-files-found: error
          retention-days: 14
