name: Public Docker Build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "cgtlib/**"
      - "processual_kernel/**"
      - "processual_api/**"
      - ".github/workflows/docker.yml"
      - "tests/test_public_docker_trust_boundary_r1.py"
  workflow_dispatch:

jobs:
  public-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ephemeral public Docker image
        if: github.event_name != 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: public
          push: false
          load: true
          tags: pmk-public-qualification:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push tagged public Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: public
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/processual-maestro-public:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/processual-maestro-public:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke public image trust boundary
        if: github.event_name != 'push'
        shell: bash
        run: |
          docker run --rm pmk-public-qualification:${{ github.sha }} python - <<'PY'
          import importlib.util

          import cgtlib
          from processual_api.cgt_governor.governor import govern_answer
          from processual_api.integrations.private_evaluation_boundary import (
              PrivateEvaluationUnavailableError,
          )
          from processual_api.main import app

          assert cgtlib._HAS_PRIVATE is False
          assert importlib.util.find_spec("cgtlib.private") is None
          assert importlib.util.find_spec("processual_api.private_integrations") is None
          assert "/cgt/govern/evaluate" in {
              getattr(route, "path", "") for route in app.routes
          }
          assert getattr(app.state, "private_evaluation_provider", None) is None
          try:
              govern_answer(answer="public-container-probe")
          except PrivateEvaluationUnavailableError as exc:
              assert str(exc) == "private_evaluation_unavailable"
          else:
              raise AssertionError("public container must fail closed without private provider")
          PY

      - name: Record ephemeral public image identity
        if: github.event_name != 'push'
        run: docker image inspect pmk-public-qualification:${{ github.sha }} --format '{{.Id}}'
