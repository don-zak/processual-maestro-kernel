name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Build target (public|private)"
        required: true
        default: "private"
        type: choice
        options: [public, private]

jobs:
  verify-public-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build public Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          target: public
          tags: processual-maestro-public:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["public"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (${{ matrix.target }})
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          target: ${{ matrix.target }}
          tags: |
            ${{ matrix.target == 'public' && format('ghcr.io/{0}/processual-maestro-public:{1}', github.repository_owner, github.ref_name) || format('ghcr.io/{0}/processual-maestro:{1}', github.repository_owner, github.ref_name) }}
            ${{ matrix.target == 'public' && format('ghcr.io/{0}/processual-maestro-public:latest', github.repository_owner) || format('ghcr.io/{0}/processual-maestro:latest', github.repository_owner) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
