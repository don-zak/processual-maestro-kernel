<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Maestro Plans</title>
<style>
:root{--bg:#05080d;--card:#101722;--line:rgba(61,88,145,.45);--text:#e7edf8;--muted:#8ca0c4;--amber:#f5a623}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(245,166,35,.08),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:42px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{letter-spacing:.28em;font-weight:800;text-transform:uppercase}.back-link{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 14px}.hero{border:1px solid var(--line);border-radius:28px;background:rgba(16,23,34,.82);padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.32)}.eyebrow{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0 0 10px}h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:0 0 14px}.hero-copy,.catalog-state{color:var(--muted);line-height:1.6}.plan-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:28px}.plan-card{display:flex;min-height:210px;border:1px solid var(--line);border-radius:24px;background:rgba(11,19,36,.82);text-decoration:none;color:inherit;padding:22px;transition:transform .15s ease,border-color .15s ease,background .15s ease}.plan-card:hover,.plan-card:focus-visible{transform:translateY(-3px);border-color:rgba(245,166,35,.72);background:rgba(16,23,34,.98);outline:none}.plan-card-content{display:flex;flex-direction:column;width:100%}.plan-card h2{font-size:23px;margin:0 0 10px}.plan-description{color:var(--muted);line-height:1.55;margin:0 0 24px}.plan-action{margin-top:auto;color:var(--amber);font-weight:800}.error{border:1px solid rgba(255,68,102,.45);border-radius:18px;color:#ffd5dd;background:rgba(255,68,102,.08);padding:16px}@media(max-width:980px){.status-row,.plan-grid,.offer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.page{width:min(100% - 22px,1120px);padding-top:24px}.topbar{align-items:flex-start;flex-direction:column}.hero{padding:22px}.status-row,.plan-grid,.offer-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.plan-card{transition:none}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar"><div class="brand">MAESTRO</div><a class="back-link" href="/login">Back to login</a></div>
  <section class="hero">
    <p class="eyebrow">Maestro plans</p>
    <h1>Choose the plan that fits your work</h1>
    <p class="hero-copy">Explore the available Maestro plans. Select a plan to open its dedicated space, review every detail, and continue through registration and activation.</p>
    <p class="catalog-state" id="catalog-state" role="status">Loading available plans...</p>
    <div class="plan-grid" id="pricing-plan-grid" aria-live="polite"></div>
  </section>
</main>
<script>
(function () {
  const state = document.getElementById("catalog-state");
  const grid = document.getElementById("pricing-plan-grid");
  function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, (character) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character])); }
  function planCard(plan) {
    const id = encodeURIComponent(String(plan.plan_id || ""));
    return `<a class="plan-card" href="/plans/${id}" data-plan-id="${escapeHtml(plan.plan_id)}"><span class="plan-card-content"><h2>${escapeHtml(plan.display_name || "Plan")}</h2><span class="plan-description">${escapeHtml(plan.description || "")}</span><span class="plan-action">Discover this plan â†’</span></span></a>`;
  }
  async function loadJson(url) { const response = await fetch(url,{headers:{"Accept":"application/json"}}); if(!response.ok) throw new Error(`${url} failed: ${response.status}`); return response.json(); }
  async function loadPricingSurface() {
    try {
      const payload = await loadJson("/billing/commercial-pricing-catalog").catch(() => loadJson("/billing/pricing-catalog"));
      const plans = Array.isArray(payload.plans) ? payload.plans.filter((plan) => plan.commercially_listed === true) : [];
      if (!plans.length) { state.textContent = "No plans are currently listed."; grid.innerHTML = ""; return; }
      state.textContent = `${plans.length} plans available`; grid.innerHTML = plans.map(planCard).join("");
    } catch (error) { state.innerHTML = `<span class="error">Unable to load plans. ${escapeHtml(error.message)}</span>`; grid.innerHTML = ""; }
  }
  loadPricingSurface();
})();
</script>
</body>
</html>
