<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <defs>
    <filter id="route-edge" x="0" y="0" width="1672" height="941" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="1.35" result="eroded"/>
      <feComposite in="SourceGraphic" in2="eroded" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="0.45" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="edge"/>
      </feMerge>
    </filter>
    <filter id="route-edge-cyan" x="0" y="0" width="1672" height="941" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="erode" radius="1.7" result="eroded"/>
      <feComposite in="SourceGraphic" in2="eroded" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="0.35" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="edge"/>
      </feMerge>
    </filter>
  </defs>
  <g opacity="0.88">
    <image href="splash_routes_cyan.svg" x="0" y="0" width="1672" height="941" filter="url(#route-edge-cyan)"/>
    <image href="splash_routes_teal.svg" x="0" y="0" width="1672" height="941" filter="url(#route-edge)"/>
    <image href="splash_routes_lime.svg" x="0" y="0" width="1672" height="941" filter="url(#route-edge)"/>
    <image href="splash_routes_amber.svg" x="0" y="0" width="1672" height="941" filter="url(#route-edge)"/>
    <image href="splash_routes_violet.svg" x="0" y="0" width="1672" height="941" filter="url(#route-edge)"/>
  </g>
</svg>
