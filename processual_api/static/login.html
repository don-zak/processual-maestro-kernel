<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Maestro Kernel - Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b0f;color:#c8d8f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:22px}.wrap{width:min(100%,420px)}.card{background:#111620;border:1px solid #2a3650;border-radius:16px;padding:32px;box-shadow:0 18px 60px rgba(0,0,0,.48)}.brand{text-align:center;margin-bottom:22px}.brand-mark{width:48px;height:48px;margin:0 auto 8px}.brand-title{font-weight:800;letter-spacing:.16em;color:#e8f0fc}.brand-sub{font-size:10px;color:#5a7299;letter-spacing:.2em;margin-top:4px}.back{display:block;text-align:center;color:#8aa3c8;text-decoration:none;font-size:12px;margin-bottom:18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.tab{border:1px solid #2a3650;border-radius:8px;background:transparent;color:#8aa3c8;padding:9px;cursor:pointer;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.tab.active{background:#f5a623;color:#080b0f;border-color:#f5a623}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;color:#8aa3c8;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.input-wrap{position:relative}.input{width:100%;border:1px solid #2a3650;border-radius:8px;background:#0b1018;color:#e8f0fc;padding:11px 12px;font:inherit;outline:none}.input.password{padding-right:72px}.input:focus{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.08)}.visibility{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:1px solid #2a3650;border-radius:6px;background:#111620;color:#8aa3c8;padding:6px 8px;cursor:pointer}.primary{width:100%;border:0;border-radius:8px;background:#f5a623;color:#080b0f;padding:11px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.55}.error{display:none;color:#f87171;text-align:center;font-size:12px;margin-top:12px}.secondary-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.secondary{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid #2a3650;border-radius:10px;background:#0b1018;color:#8aa3c8;text-decoration:none;font-size:12px;font-weight:700;text-align:center;padding:8px}.secondary:hover,.secondary:focus-visible{border-color:#f5a623;color:#e8f0fc}.footer{text-align:center;color:#3d5070;font-size:10px;margin-top:14px;letter-spacing:.08em}.btn-text{display:block;text-align:center;margin-top:14px;color:#f5a623}.inp-group{margin:14px 0}.inp-label{display:block;margin-bottom:6px;color:#8aa3c8;font-size:11px;text-transform:uppercase}.inp{width:100%;border:1px solid #2a3650;border-radius:8px;background:#0b1018;color:#e8f0fc;padding:11px 12px}.btn{width:100%;border:0;border-radius:8px;background:#f5a623;color:#080b0f;padding:11px;font-weight:800}[hidden]{display:none!important}@media(max-width:480px){.secondary-actions{grid-template-columns:1fr}}
</style>
<script src="/console/js/login_token_capture.js?v=adminauth03"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <a class="back" href="/">&larr; Back to splash</a>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><polygon points="16,2 28,9 28,23 16,30 4,23 4,9" stroke="#f5a623" stroke-width="1.5"/><polygon points="16,8 22,11.5 22,20.5 16,24 10,20.5 10,11.5" stroke="#f5a623" opacity=".55"/><circle cx="16" cy="16" r="2.5" fill="#f5a623"/></svg>
      <div class="brand-title">MAESTRO</div><div class="brand-sub">PROCESSUAL KERNEL</div>
    </div>
    <div class="tabs tab-row" role="tablist" aria-label="Sign-in role">
      <button id="tab-admin" class="tab active" type="button" role="tab" aria-selected="true">Admin</button>
      <button id="tab-user" class="tab" type="button" role="tab" aria-selected="false">User</button>
    </div>
    <div id="login-fields">
      <div class="field"><label for="login-username">Username</label><input id="login-username" class="input" autocomplete="username" placeholder="admin"></div>
      <div class="field"><label for="login-password">Password</label><div class="input-wrap"><input id="login-password" class="input password" type="password" autocomplete="current-password" placeholder="********"><button id="login-password-visibility" class="visibility" type="button" aria-label="Show password" aria-pressed="false">Show</button></div></div>
    </div>
    <button id="login-btn" class="primary btn" type="button"><span>Sign In</span></button>
    <div id="login-error" class="error" role="alert"></div>
    <div class="secondary-actions" aria-label="Access options">
      <a class="secondary" href="/plans">Offers &amp; Registration</a>
      <a class="secondary" id="login-lost-access-button" href="/console/account-recovery.html">Lost Access?</a>
    </div>
  </div>
  <div class="footer">v2.0.0 &middot; B2B &middot; Invite-only</div>
</div>
<script>
(() => {
  'use strict';
  let currentRole='admin';
  const admin=document.getElementById('tab-admin');
  const user=document.getElementById('tab-user');
  const username=document.getElementById('login-username');
  const password=document.getElementById('login-password');
  const button=document.getElementById('login-btn');
  const error=document.getElementById('login-error');
  const visibility=document.getElementById('login-password-visibility');

  function activate(next){
    currentRole=next;
    const isAdmin=currentRole==='admin';
    admin.classList.toggle('active',isAdmin); user.classList.toggle('active',!isAdmin);
    admin.setAttribute('aria-selected',String(isAdmin)); user.setAttribute('aria-selected',String(!isAdmin));
    username.placeholder=isAdmin?'admin':'email@example.com';
    error.style.display='none'; error.textContent='';
  }
  function showError(message){error.textContent=message || 'Sign in failed.';error.style.display='block';}
  async function adminLogin(){
    if(currentRole!=='admin') return;
    const name=username.value.trim(), pass=password.value;
    if(!name || !pass){showError('Enter username and password.');return;}
    error.style.display='none'; button.disabled=true; button.textContent='Signing in...';
    try{
      const response=await fetch('/auth/token',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:name,password:pass,role: currentRole})});
      const data=await response.json().catch(()=>({}));
      if(!response.ok || !data.access_token) throw new Error(data.detail || 'Invalid credentials.');
      window.PMK_LOGIN_TOKEN_CAPTURE?.persistAuthPayload?.({...data,role:'admin'});
      password.value='';
      window.location.assign('/admin');
    }catch(exc){showError(exc?.message || 'Sign in failed.');}
    finally{button.disabled=false;button.textContent='Sign In';}
  }
  admin.addEventListener('click',()=>activate('admin'));
  user.addEventListener('click',()=>activate('user'));
  button.addEventListener('click',adminLogin);
  password.addEventListener('keydown',(event)=>{if(event.key==='Enter' && currentRole==='admin'){event.preventDefault();adminLogin();}});
  visibility.addEventListener('click',()=>{const showing=password.type==='text';password.type=showing?'password':'text';visibility.textContent=showing?'Show':'Hide';visibility.setAttribute('aria-pressed',String(!showing));visibility.setAttribute('aria-label',showing?'Show password':'Hide password');});
  activate('admin');
})();
</script>
</body>
</html>
