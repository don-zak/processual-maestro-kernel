<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-label="Maestro PCB v18 measured visual-pin reconstruction">
<defs>
  <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#2a638d" stroke-opacity=".07" stroke-width=".4"/><circle cx="2" cy="2" r=".65" fill="#4aa5d7" fill-opacity=".11"/></pattern>
  <pattern id="dotsL" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".8" fill="#36bfff" fill-opacity=".34"/><circle cx="15" cy="13" r=".55" fill="#23d8c8" fill-opacity=".22"/></pattern>
  <pattern id="dotsR" width="23" height="21" patternUnits="userSpaceOnUse"><circle cx="4" cy="3" r=".78" fill="#e59a20" fill-opacity=".33"/><circle cx="16" cy="14" r=".52" fill="#ffc65c" fill-opacity=".20"/></pattern>
  <filter id="routeGlow"><feGaussianBlur stdDeviation="1.45" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="nodeGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="halo"><stop stop-color="#0b6fa9" stop-opacity=".15"/><stop offset=".62" stop-color="#06233e" stop-opacity=".05"/><stop offset="1" stop-color="#020712" stop-opacity="0"/></radialGradient>
  <style>
    .route{fill:none;stroke-linecap:round;stroke-linejoin:round;filter:url(#routeGlow)}
    .primary{stroke-width:1.15;opacity:.96}.secondary{stroke-width:.74;opacity:.62}.micro{stroke-width:.48;opacity:.32}
    .cyan{stroke:#36bfff}.teal{stroke:#23d8c8}.lime{stroke:#a7d67b}.amber{stroke:#f5a623}.violet{stroke:#c16fff}
    .rail{fill:none;stroke-width:.72;opacity:.45}.node{filter:url(#nodeGlow)}
  </style>
</defs>
<rect width="1672" height="941" fill="url(#grid)"/>
<ellipse cx="836" cy="444" rx="610" ry="410" fill="url(#halo)"/>
<rect x="20" y="55" width="610" height="740" fill="url(#dotsL)" opacity=".23"/>
<rect x="1042" y="55" width="610" height="740" fill="url(#dotsR)" opacity=".22"/>

