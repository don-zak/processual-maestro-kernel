<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Processual Maestro Kernel v2.0.0 - Orchestration Board Proof</title>
<link rel="icon" type="image/svg+xml" href="/console/favicon.svg">
<link rel="apple-touch-icon" href="/console/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--void:#080b0f;--surface-0:#111620;--amber:#f5a623;--amber-dim:#c47f10;--amber-glow:rgba(245,166,35,0.2);--text:#c8d8f0;--bright:#e8f0fc;--muted:#3d5070;--ghost:#5a7299;--soft:#8aa3c8;--ok:#22d3a0;--error:#f87171;--warn:#fbbf24;--rim:#2a3650;--cyan:#41c8ff;--teal:#20d9ca;--violet:#a873ff;--font-display:'Syne',sans-serif;--font-mono:'Space Mono',monospace;--font-data:'DM Mono',monospace}
body{background:var(--void);color:var(--text);font-family:var(--font-display);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
#orchestration-board{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 70% 64% at 50% 48%,rgba(18,42,74,.35) 0%,rgba(8,11,15,0) 62%),linear-gradient(180deg,#08101a 0%,#080b0f 58%,#06090d 100%)}
#orchestration-board::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(76,123,170,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(76,123,170,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse 88% 86% at 50% 50%,#000 32%,transparent 86%);opacity:.8}
#board-canvas{position:absolute;inset:0;width:100%;height:100%}
.board-vignette{position:absolute;inset:0;background:radial-gradient(ellipse 34% 45% at 50% 50%,rgba(8,11,15,.06) 0%,rgba(8,11,15,.2) 44%,rgba(8,11,15,.72) 100%)}
.board-legend{position:absolute;left:28px;bottom:22px;display:flex;gap:8px;align-items:center;font:9px/1 var(--font-data);letter-spacing:.13em;text-transform:uppercase;color:rgba(138,163,200,.34)}
.board-legend i{width:22px;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);box-shadow:0 0 7px rgba(245,166,35,.45)}
#bg-gradient{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 54% 48% at 50% 43%,rgba(245,166,35,0.055) 0%,rgba(65,200,255,.018) 44%,transparent 74%)}
.splash-wrap{position:relative;z-index:2;width:100%;max-width:520px;padding:20px;animation:fadeIn 1s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(22,29,42,0.65);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(42,54,80,0.6);border-radius:20px;padding:48px 40px 36px;box-shadow:0 8px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(245,166,35,0.06)}
.logo-area{text-align:center;margin-bottom:28px}
#logo-svg{width:80px;height:80px;margin:0 auto;animation:logoFloat 4s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#logo-svg svg{width:80px;height:80px;filter:drop-shadow(0 0 20px rgba(245,166,35,0.15))}
#logo-svg .hex-outer{stroke:#f5a623;stroke-width:1.5;fill:rgba(245,166,35,0.06);animation:glowPulse 3s ease-in-out infinite}
#logo-svg .hex-inner{stroke:#f5a623;stroke-width:1;fill:none;opacity:0.6;animation:spinSlow 12s linear infinite;transform-origin:16px 16px}
#logo-svg .hex-dot{fill:#f5a623;animation:dotPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(245,166,35,0.2))}50%{filter:drop-shadow(0 0 16px rgba(245,166,35,0.45))}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes dotPulse{0%,100%{r:2.5;opacity:1}50%{r:3.5;opacity:0.7}}
.logo-text{margin-top:14px}
.logo-text .m{font-size:26px;font-weight:800;color:var(--bright);letter-spacing:3px;font-family:var(--font-display)}
.logo-text .m span{color:var(--amber)}
.logo-text .s{font-size:10px;color:var(--ghost);letter-spacing:4px;text-transform:uppercase;font-family:var(--font-data);margin-top:3px}
#tagline-wrap{height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
#tagline{font-family:var(--font-data);font-size:13px;color:var(--soft);text-align:center;letter-spacing:0.04em;min-height:1.4em}
#tagline .cursor{display:inline-block;width:2px;height:15px;background:var(--amber);margin-left:2px;animation:cursorBlink 0.7s step-end infinite;vertical-align:text-bottom}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.status-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(17,22,32,0.6);border:1px solid var(--rim);border-radius:10px;transition:all 0.3s}
.status-item .si-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:all 0.5s}
.status-item .si-dot.loading{background:var(--muted);animation:pulseLoad 1s ease infinite}
.status-item .si-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status-item .si-dot.off{background:var(--error);box-shadow:0 0 8px var(--error)}
@keyframes pulseLoad{0%,100%{opacity:0.3}50%{opacity:1}}
.status-item .si-label{font-family:var(--font-data);font-size:11px;color:var(--ghost);letter-spacing:0.06em}
.status-item .si-status{font-family:var(--font-mono);font-size:9px;margin-left:auto;text-transform:uppercase;letter-spacing:0.08em}
.status-item .si-status.loading{color:var(--muted)}
.status-item .si-status.on{color:var(--ok)}
.status-item .si-status.off{color:var(--error)}
#progress-wrap{margin-bottom:28px}
#progress-bar{width:100%;height:3px;background:var(--surface-0);border-radius:99px;overflow:hidden;position:relative}
#progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber-dim),var(--amber),var(--amber-dim));border-radius:99px;transition:width 0.4s ease;position:relative}
#progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#progress-text{font-family:var(--font-data);font-size:10px;color:var(--muted);text-align:center;margin-top:6px;letter-spacing:0.08em;transition:opacity 0.3s}
.btn-area{text-align:center}
#launch-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;background:linear-gradient(135deg,var(--amber),#e0a020);border:none;border-radius:12px;color:var(--void);font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:1.5px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;opacity:0;transform:translateY(10px);pointer-events:none}
#launch-btn.visible{opacity:1;transform:translateY(0);pointer-events:auto}
#launch-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,166,35,0.35)}
#launch-btn:active{transform:translateY(0)}
#launch-btn .btn-arrow{font-size:18px;transition:transform 0.3s}
#launch-btn:hover .btn-arrow{transform:translateX(4px)}
.footer{text-align:center;margin-top:20px;font-family:var(--font-data);font-size:9px;color:var(--muted);letter-spacing:1.5px}
.footer .v{color:var(--ghost)}
@media(max-width:480px){.card{padding:32px 24px 28px}.logo-text .m{font-size:20px;letter-spacing:2px}#logo-svg{width:64px;height:64px}#logo-svg svg{width:64px;height:64px}.status-grid{grid-template-columns:1fr}.board-legend{display:none}}
@media(prefers-reduced-motion:reduce){.splash-wrap,#logo-svg,#logo-svg .hex-outer,#logo-svg .hex-inner,#logo-svg .hex-dot,#tagline .cursor,.status-item .si-dot.loading,#progress-fill::after{animation:none!important}.board-legend{opacity:.75}}
</style>
</head>
<body>
<div id="orchestration-board" aria-hidden="true">
  <canvas id="board-canvas"></canvas>
  <div class="board-vignette"></div>
  <div class="board-legend"><i></i><span>governance signal field / proof</span></div>
</div>
<div id="bg-gradient"></div>
<div class="splash-wrap">
  <div class="card">
    <div class="logo-area">
      <div id="logo-svg">
        <svg viewBox="0 0 32 32" fill="none">
          <polygon class="hex-outer" points="16,1.5 28.5,9 28.5,23 16,30.5 3.5,23 3.5,9"/>
          <polygon class="hex-inner" points="16,8 22,11.5 22,20.5 16,24 10,20.5 10,11.5"/>
          <circle class="hex-dot" cx="16" cy="16" r="2.5" fill="#f5a623"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="m">MAESTRO<span>.</span></div>
        <div class="s">PROCESSUAL KERNEL</div>
      </div>
    </div>

    <div id="tagline-wrap"><div id="tagline"></div></div>

    <div class="status-grid">
      <div class="status-item"><div class="si-dot loading" id="sd-api"></div><span class="si-label">API Server</span><span class="si-status loading" id="ss-api">loading</span></div>
      <div class="status-item"><div class="si-dot loading" id="sd-db"></div><span class="si-label">Database</span><span class="si-status loading" id="ss-db">loading</span></div>
      <div class="status-item"><div class="si-dot loading" id="sd-redis"></div><span class="si-label">Cache</span><span class="si-status loading" id="ss-redis">loading</span></div>
      <div class="status-item"><div class="si-dot loading" id="sd-kernel"></div><span class="si-label">Kernel</span><span class="si-status loading" id="ss-kernel">loading</span></div>
    </div>

    <div id="progress-wrap">
      <div id="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-text">Initializing services...</div>
    </div>

    <div class="btn-area">
      <button id="launch-btn"><span>Enter Maestro</span><span class="btn-arrow">→</span></button>
    </div>

    <div class="footer"><span class="v">v2.0.0</span> &nbsp;·&nbsp; Qualification Build &nbsp;·&nbsp; CGT v2</div>
  </div>
</div>

<script>
const boardCanvas = document.getElementById('board-canvas');
const boardCtx = boardCanvas.getContext('2d');
const boardCard = document.querySelector('.card');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let boardWidth = 0;
let boardHeight = 0;
let boardDpr = 1;
let boardPaths = [];
let boardFrame = 0;
let boardAnimation = null;

const BOARD_PALETTE = [
  {rgb:'245,166,35', weight:0.92},
  {rgb:'65,200,255', weight:0.88},
  {rgb:'32,217,202', weight:0.62},
  {rgb:'168,115,255', weight:0.48}
];

function seededNoise(seed) {
  const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

function pointOnPolyline(points, t) {
  const lengths = [];
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - points[i - 1].x;
    const dy = points[i].y - points[i - 1].y;
    const len = Math.hypot(dx, dy);
    lengths.push(len);
    total += len;
  }
  let target = Math.max(0, Math.min(1, t)) * total;
  for (let i = 0; i < lengths.length; i++) {
    if (target <= lengths[i]) {
      const a = points[i];
      const b = points[i + 1];
      const local = lengths[i] ? target / lengths[i] : 0;
      return {x:a.x + (b.x - a.x) * local, y:a.y + (b.y - a.y) * local};
    }
    target -= lengths[i];
  }
  return points[points.length - 1];
}

function buildBoardPaths() {
  if (!boardCard) return;
  const rect = boardCard.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const edgePad = 7;
  const margin = Math.max(34, Math.min(boardWidth, boardHeight) * 0.05);
  const paths = [];
  const sideCount = boardWidth < 760 ? 5 : 9;
  const topCount = boardWidth < 760 ? 4 : 7;

  function addPath(side, index, count) {
    const n = index + 1;
    const rand = seededNoise((side.charCodeAt(0) + 1) * 97 + n * 31);
    const color = BOARD_PALETTE[(index + side.length) % BOARD_PALETTE.length];
    let start, p1, p2, p3, end;

    if (side === 'left' || side === 'right') {
      const y = rect.top + rect.height * (n / (count + 1));
      const dir = side === 'left' ? -1 : 1;
      start = {x:side === 'left' ? rect.left - edgePad : rect.right + edgePad,y};
      p1 = {x:start.x + dir * (44 + rand * 34),y};
      const rise = (rand - .5) * Math.min(180, boardHeight * .22);
      p2 = {x:p1.x + dir * (60 + rand * 110),y:y + rise};
      p3 = {x:p2.x + dir * (65 + (1-rand) * 100),y:p2.y};
      end = {x:side === 'left' ? margin : boardWidth - margin,y:Math.max(margin,Math.min(boardHeight-margin,p3.y + (rand-.5)*120))};
    } else {
      const x = rect.left + rect.width * (n / (count + 1));
      const dir = side === 'top' ? -1 : 1;
      start = {x,y:side === 'top' ? rect.top - edgePad : rect.bottom + edgePad};
      p1 = {x,y:start.y + dir * (38 + rand * 26)};
      const sway = (rand - .5) * Math.min(170, boardWidth * .16);
      p2 = {x:x + sway,y:p1.y + dir * (58 + rand * 90)};
      p3 = {x:p2.x,y:p2.y + dir * (48 + (1-rand) * 80)};
      end = {x:Math.max(margin,Math.min(boardWidth-margin,p3.x + (rand-.5)*110)),y:side === 'top' ? margin : boardHeight-margin};
    }

    paths.push({
      points:[start,p1,p2,p3,end],
      color:color.rgb,
      alpha:.18 + color.weight * .17,
      width:.55 + color.weight * .65,
      phase:rand,
      speed:.000055 + rand * .000055,
      pulseCount:rand > .72 ? 2 : 1,
      nodeAt:.36 + rand * .42,
      feedback:rand > .58
    });
  }

  for (let i = 0; i < sideCount; i++) { addPath('left',i,sideCount); addPath('right',i,sideCount); }
  for (let i = 0; i < topCount; i++) { addPath('top',i,topCount); addPath('bottom',i,topCount); }

  boardPaths = paths;
  boardCenter = {cx,cy,rect};
}

let boardCenter = null;

function resizeBoard() {
  boardDpr = Math.min(window.devicePixelRatio || 1, 2);
  boardWidth = window.innerWidth;
  boardHeight = window.innerHeight;
  boardCanvas.width = Math.round(boardWidth * boardDpr);
  boardCanvas.height = Math.round(boardHeight * boardDpr);
  boardCanvas.style.width = boardWidth + 'px';
  boardCanvas.style.height = boardHeight + 'px';
  boardCtx.setTransform(boardDpr,0,0,boardDpr,0,0);
  buildBoardPaths();
}

function drawRoundedTrace(points, stroke, width, alpha) {
  boardCtx.save();
  boardCtx.beginPath();
  boardCtx.moveTo(points[0].x,points[0].y);
  for (let i=1;i<points.length;i++) boardCtx.lineTo(points[i].x,points[i].y);
  boardCtx.strokeStyle=`rgba(${stroke},${alpha})`;
  boardCtx.lineWidth=width;
  boardCtx.lineJoin='round';
  boardCtx.lineCap='round';
  boardCtx.stroke();
  boardCtx.restore();
}

function drawBoard(now=0) {
  boardCtx.clearRect(0,0,boardWidth,boardHeight);
  if (!boardCenter) return;
  const {cx,cy,rect} = boardCenter;

  boardCtx.save();
  boardCtx.translate(cx,cy);
  for (let r=0;r<3;r++) {
    boardCtx.beginPath();
    boardCtx.ellipse(0,0,rect.width*.73+r*64,rect.height*.62+r*48,0,0,Math.PI*2);
    boardCtx.strokeStyle=`rgba(85,129,174,${.038-r*.008})`;
    boardCtx.lineWidth=.8;
    boardCtx.setLineDash([2,11+r*4]);
    boardCtx.stroke();
  }
  boardCtx.restore();
  boardCtx.setLineDash([]);

  boardPaths.forEach((path,index)=>{
    drawRoundedTrace(path.points,path.color,path.width,path.alpha);
    const node=pointOnPolyline(path.points,path.nodeAt);
    boardCtx.beginPath();
    boardCtx.arc(node.x,node.y,1.5+(index%3)*.35,0,Math.PI*2);
    boardCtx.fillStyle=`rgba(${path.color},${path.alpha+.18})`;
    boardCtx.fill();

    if (path.feedback) {
      boardCtx.beginPath();
      boardCtx.arc(node.x,node.y,7+(index%2)*3,0,Math.PI*2);
      boardCtx.strokeStyle=`rgba(${path.color},.085)`;
      boardCtx.lineWidth=.8;
      boardCtx.stroke();
    }

    if (!reduceMotion.matches) {
      for (let p=0;p<path.pulseCount;p++) {
        const t=(path.phase + now*path.speed + p/path.pulseCount)%1;
        const pos=pointOnPolyline(path.points,t);
        const glow=boardCtx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,10);
        glow.addColorStop(0,`rgba(${path.color},.96)`);
        glow.addColorStop(.18,`rgba(${path.color},.58)`);
        glow.addColorStop(1,`rgba(${path.color},0)`);
        boardCtx.fillStyle=glow;
        boardCtx.beginPath();
        boardCtx.arc(pos.x,pos.y,10,0,Math.PI*2);
        boardCtx.fill();
        boardCtx.beginPath();
        boardCtx.arc(pos.x,pos.y,1.45,0,Math.PI*2);
        boardCtx.fillStyle=`rgba(${path.color},1)`;
        boardCtx.fill();
      }
    }
  });

  const halo=boardCtx.createRadialGradient(cx,cy,Math.max(rect.width,rect.height)*.25,cx,cy,Math.max(rect.width,rect.height)*.9);
  halo.addColorStop(0,'rgba(245,166,35,.035)');
  halo.addColorStop(.48,'rgba(65,200,255,.018)');
  halo.addColorStop(1,'rgba(8,11,15,0)');
  boardCtx.fillStyle=halo;
  boardCtx.fillRect(0,0,boardWidth,boardHeight);

  boardFrame++;
  if (!reduceMotion.matches) boardAnimation=requestAnimationFrame(drawBoard);
}

function restartBoard() {
  if (boardAnimation) cancelAnimationFrame(boardAnimation);
  boardAnimation=null;
  resizeBoard();
  drawBoard(performance.now());
}

window.addEventListener('resize',restartBoard,{passive:true});
reduceMotion.addEventListener?.('change',restartBoard);
restartBoard();

const taglines = [
  'Initializing Processual Maestro Kernel...',
  'Loading Adaptive Governance Toolkit...',
  'Calibrating CGT v2 Fate Vectors...',
  'Establishing Secure Channels...',
  'System Ready — Orchestration Online'
];
const statusOrder = ['sd-api','sd-db','sd-redis','sd-kernel'];
let step = 0, isComplete = false;
const taglineEl = document.getElementById('tagline');
const launchBtn = document.getElementById('launch-btn');
const progressFill = document.getElementById('progress-fill');
const progressText = document.getElementById('progress-text');

function typewriter(text, el, speed, cb) {
  let i = 0; el.textContent = '';
  const cursor = document.createElement('span'); cursor.className = 'cursor';
  function type() {
    if (i < text.length) { el.textContent = text.slice(0, i + 1); el.appendChild(cursor); i++; setTimeout(type, speed); }
    else if (cb) cb();
  }
  type();
}

function setStatusItem(id, state) {
  const dot = document.getElementById(id);
  const statusEl = document.getElementById(id.replace('sd-','ss-'));
  if (!dot || !statusEl) return;
  dot.className = 'si-dot ' + state;
  statusEl.className = 'si-status ' + state;
  statusEl.textContent = state === 'on' ? 'online' : state === 'off' ? 'offline' : 'loading';
}

function bootStep() {
  if (step >= taglines.length) return;
  const idx = step;
  progressFill.style.width = ((idx + 1) / taglines.length) * 100 + '%';
  progressText.textContent = taglines[idx];
  progressText.style.opacity = '1';

  typewriter(taglines[idx], taglineEl, 20, () => {
    if (idx < taglines.length - 1) {
      setTimeout(() => { step++; bootStep(); }, 400);
      return;
    }
    setTimeout(() => {
      statusOrder.forEach(id => setStatusItem(id, 'on'));
      progressFill.style.width = '100%';
      progressText.textContent = 'All systems operational.';
      isComplete = true;
      launchBtn.classList.add('visible');
    }, 500);
  });

  if (idx > 0 && idx <= statusOrder.length) {
    setStatusItem(statusOrder[idx - 1], 'on');
  }
}

launchBtn.addEventListener('click', () => {
  if (!isComplete) return;
  sessionStorage.setItem('maestro_descent_gate_seen', '1');
  sessionStorage.setItem('maestro_descent_gate_seen_at', new Date().toISOString());
  window.location.href = '/login';
});

setTimeout(() => { step = 0; bootStep(); }, 600);
</script>
</body>
</html>
