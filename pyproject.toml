[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "processual-maestro-kernel"
version = "2.0.0"
description = "Processual Maestro Kernel with CGT v2, security layer, backend API, observability, and Discord monitoring under governed qualification."
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "Zakaria Essamit / ChatGPT implementation"}]
dependencies = ["cryptography>=41", "bcrypt>=4.1", "tzdata>=2024.1; platform_system == \"Windows\""]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "orjson>=3.10",
  "httpx>=0.27",
  "PyYAML>=6.0",
]
security = [
  "PyJWT[crypto]>=2.13",
  "argon2-cffi>=23.1",
  "bcrypt>=4.1",
]
database = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
]
cache = [
  "redis>=5.0",
]
observability = [
  "prometheus-client>=0.20",
  "sentry-sdk[fastapi]>=2",
]
llm = [
  "openai>=1.55",
  "anthropic>=0.50",
  "google-genai>=1.0",
]
reports = [
  "reportlab>=4.2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.10",
  "flake8>=7",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5",
]
load = [
  "locust>=2.31",
]
all = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "orjson>=3.10",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "PyJWT[crypto]>=2.13",
  "argon2-cffi>=23.1",
  "bcrypt>=4.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "sentry-sdk[fastapi]>=2",
  "openai>=1.55",
  "anthropic>=0.50",
  "google-genai>=1.0",
  "reportlab>=4.2",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.10",
  "flake8>=7",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5",
  "locust>=2.31",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"cgtlib.data" = ["reference_scenarios.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["processual_kernel*", "cgtlib*", "processual_api*"]
exclude = ["tests*", "docs*", "scripts*", "build*", "dist*"]

[tool.pytest.ini_options]
addopts = "-p no:ddtrace"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cgtlib", "processual_kernel", "processual_api"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001"]
"tests/*.py" = ["E501", "I001", "UP017"]
"tests/integration/*.py" = ["E731"]
"tests/test_lemon_subscription_checkout_authority_a3.py" = ["E731"]
"tests/test_migration_regression_lock_a3.py" = ["W292"]
"qualification/*.py" = ["E501", "F401", "I001"]
"cgtlib/aftermath.py" = ["I001"]
"cgtlib/evaluators.py" = ["I001"]
"cgtlib/existence.py" = ["I001"]
"cgtlib/fate.py" = ["I001"]
"cgtlib/gates.py" = ["I001"]
"cgtlib/lift.py" = ["I001"]
"cgtlib/possibility.py" = ["I001"]
"processual_api/cgt_governor/reports/llm_reporter.py" = ["E501"]
"processual_api/admin_marketplace/lemon_squeezy_inbox_lifecycle.py" = ["I001"]
"processual_api/admin_marketplace/subscription_runtime.py" = ["I001"]
"processual_api/admin_marketplace/subscription_runtime_persistence.py" = ["E501", "I001"]
"processual_api/admin_marketplace/subscription_runtime_transition_persistence.py" = ["E501"]
"processual_api/admin_marketplace/subscription_usage_router.py" = ["W292"]
"processual_api/billing/lemon_checkout_binding.py" = ["I001"]
"processual_api/middleware/security_headers.py" = ["I001"]
"processual_api/staging_smoke.py" = ["I001"]

[tool.flake8]
max-line-length = 120
max-complexity = 15
extend-ignore = "E203, W503"

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "cgtlib.reference_data"
disable_error_code = ["call-overload", "arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = [
    "processual_kernel.audit",
    "processual_kernel.adaptive.ui",
    "processual_kernel.adaptive.persistence",
    "processual_kernel.adaptive.efficiency",
    "processual_kernel.adaptive.encryption",
    "processual_kernel.adaptive.certification",
    "processual_kernel.adaptive.ops_governance",
    "processual_kernel.security.crypto",
    "cgtlib.serialization",
]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "processual_api.cgt_governor.gateway.registry"
disable_error_code = ["valid-type"]

[[tool.mypy.overrides]]
module = "processual_api.db.session"
disable_error_code = ["misc", "assignment"]

[[tool.mypy.overrides]]
module = "processual_api.cache.redis"
disable_error_code = ["assignment", "misc"]

[[tool.mypy.overrides]]
module = [
    "processual_kernel.adaptive_types",
    "processual_kernel.adaptive.task_profiler",
    "processual_kernel.adaptive.safety",
    "processual_kernel.observability.metrics",
    "processual_kernel.observability.sentry",
    "processual_kernel.adaptive.encryption",
    "processual_kernel.kernel",
    "processual_kernel.adaptive_toolkit",
    "cgtlib.sensitivity",
    "cgtlib.robustness",
]
ignore_errors = true
