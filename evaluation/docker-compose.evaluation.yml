name: processual-maestro-evaluation

services:
  db:
    image: postgres:17-alpine
    container_name: maestro-eval-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-processual_eval}
      POSTGRES_USER: ${POSTGRES_USER:-processual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - maestro_eval_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-processual} -d ${POSTGRES_DB:-processual_eval}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [evaluation]

  redis:
    image: redis:7-alpine
    container_name: maestro-eval-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [evaluation]

  api:
    image: processual-maestro-evaluation:${MAESTRO_EVAL_IMAGE_TAG:-v1}
    container_name: maestro-eval-api
    env_file:
      - .env.evaluation
    environment:
      ENVIRONMENT: development
      APP_ENV: evaluation
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-processual}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-processual_eval}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATE_LIMIT_ENABLED: "true"
      AUDIT_ENABLED: "true"
      CAPACITY_GUARD_ENABLED: "true"
      MAESTRO_TOP_UP_PURCHASE_ENABLED: "false"
      MAESTRO_LOCAL_TUNISIA_TOP_UP_ENABLED: "false"
      MAESTRO_LOCAL_TUNISIA_TOP_UP_ADMIN_ENABLED: "false"
      LEMONSQUEEZY_API_KEY: ""
      LEMONSQUEEZY_STORE_ID: ""
      LEMONSQUEEZY_WEBHOOK_SECRET: ""
      LLM_DEFAULT_PROVIDER: opencode
      OPENCODE_API_URL: http://127.0.0.1:9/v1
      OPENCODE_API_KEY: evaluation-disabled
    ports:
      - "${MAESTRO_EVAL_PORT:-8000}:8000"
    volumes:
      - maestro_eval_api_data:/app/processual_api/data
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks: [evaluation]

volumes:
  maestro_eval_pgdata:
  maestro_eval_api_data:

networks:
  evaluation:
    driver: bridge
